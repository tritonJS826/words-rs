<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сербский для жизни</title>
<style>
:root{
  --paper:#FFF8EC;--paper-2:#FFFDF8;--ink:#1d2a2e;--ink-soft:#4a5c62;--ink-mute:#7a8a90;
  --teal:#0F4C5C;--teal-2:#1a6a7e;--teal-3:#2a8598;--sun:#F2A900;--sun-2:#FFC53D;
  --ok:#2E7D32;--ok-bg:#e8f5e9;--bad:#B3261E;--bad-bg:#fdecea;
  --line:#e8dcc0;--line-soft:#f0e6d2;
  --shadow-xs:0 1px 2px rgba(15,76,92,0.05);
  --shadow-sm:0 1px 2px rgba(15,76,92,0.04), 0 2px 6px rgba(15,76,92,0.06);
  --shadow-md:0 2px 4px rgba(15,76,92,0.06), 0 6px 16px rgba(15,76,92,0.08);
  --shadow-sun:0 4px 14px rgba(242,169,0,0.30);
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:26px;
}
*{box-sizing:border-box;margin:0}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(1200px 600px at 50% -100px, #FFFCF3 0%, var(--paper) 60%);
  color:var(--ink);min-height:100dvh;line-height:1.35;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));
}
main{max-width:640px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 16px}
h1{font-size:1.55rem;color:var(--teal);margin:4px 0 2px;font-weight:800;letter-spacing:-.015em}
h2{font-size:1.2rem;color:var(--teal);margin:20px 0 10px;font-weight:800}
.sub{color:var(--ink-mute);margin-bottom:14px;font-size:.95rem}
button{
  font:inherit;cursor:pointer;border:0;border-radius:var(--r-md);padding:12px 16px;
  min-height:54px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme{
  background:linear-gradient(180deg, #ffffff, var(--paper-2));
  border:1px solid var(--line);border-radius:var(--r-lg);text-align:center;
  padding:16px 8px;position:relative;box-shadow:var(--shadow-sm);
  transition:transform .12s ease, box-shadow .2s ease, border-color .2s ease;
}
.theme:hover{border-color:var(--sun);box-shadow:var(--shadow-md)}
.theme:active{transform:scale(.98)}
.theme .e{font-size:2.4rem;display:block;line-height:1.1;filter:drop-shadow(0 1px 1px rgba(0,0,0,0.06))}
.theme .n{font-weight:700;color:var(--teal);display:block;margin-top:6px;font-size:.95rem}
.theme .star{position:absolute;top:8px;right:10px;font-size:.9rem}
.theme .imported-tag{
  position:absolute;top:6px;left:6px;background:linear-gradient(180deg, #eaf3f5, #dde9ec);
  color:var(--teal);border:1px solid #c8dde2;font-size:.62rem;padding:2px 6px;
  border-radius:6px;font-weight:700;letter-spacing:.02em;
}
.top{
  display:flex;align-items:center;gap:12px;position:sticky;top:0;margin:0 -14px 12px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;
  background:rgba(255,248,236,0.88);
  backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--line-soft);z-index:5;
}
.back{
  background:linear-gradient(180deg, #fff, var(--paper-2));border:1px solid var(--line);
  color:var(--teal);font-weight:700;min-height:44px;padding:8px 14px;
  box-shadow:var(--shadow-xs);transition:transform .08s, box-shadow .15s;
}
.back:active{transform:scale(.97)}
.count{
  margin-left:auto;color:var(--ink-mute);font-size:.85rem;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%;
}
.bar{height:8px;background:var(--line-soft);border-radius:6px;overflow:hidden;margin-bottom:10px;box-shadow:inset 0 1px 2px rgba(15,76,92,0.06)}
.bar i{display:block;height:100%;background:linear-gradient(90deg, var(--sun), var(--sun-2));box-shadow:0 1px 4px rgba(242,169,0,0.4);border-radius:6px;transition:width .3s}
.card{background:linear-gradient(180deg, #fff, var(--paper-2));border:1px solid var(--line);border-radius:var(--r-xl);padding:20px 14px;text-align:center;box-shadow:var(--shadow-md)}
.card .big{font-size:clamp(3.6rem,20vw,5rem);line-height:1.1;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.05))}
.card .ru{font-size:1.25rem;color:var(--ink-mute);margin-top:6px}
.card .sr{font-size:clamp(1.8rem,9vw,2.4rem);font-weight:800;color:var(--teal);margin-top:6px;word-break:break-word;letter-spacing:-.005em}
.card.compact{padding:14px}
.card.compact .big{font-size:clamp(3rem,16vw,4rem)}
.card.compact .sr{margin-top:0}
.say{background:linear-gradient(180deg, var(--sun-2), var(--sun));color:#1d2a2e;font-weight:800;font-size:1.05rem;width:100%;margin-top:14px;box-shadow:var(--shadow-sun);transition:transform .08s, filter .15s;border-radius:var(--r-md)}
.say:active{transform:scale(.98);filter:brightness(.97)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.nav button{background:linear-gradient(180deg, var(--teal-2), var(--teal));color:#fff;font-weight:700;font-size:1rem;min-height:52px;box-shadow:var(--shadow-sm);transition:transform .08s, box-shadow .15s, filter .15s}
.nav button:hover{filter:brightness(1.05)}
.nav button:active{transform:scale(.98);box-shadow:var(--shadow-xs)}
.nav button.light{background:linear-gradient(180deg, #fff, var(--paper-2));color:var(--teal);border:1px solid var(--line);box-shadow:var(--shadow-xs)}
.nav button:disabled{opacity:.35;cursor:default;box-shadow:none}
.wide{grid-column:1/-1}
.q{font-size:1.02rem;text-align:center;margin:10px 0 6px;color:var(--ink-soft)}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{background:linear-gradient(180deg, #fff, var(--paper-2));border:1.5px solid var(--line);font-size:1.28rem;font-weight:700;color:var(--teal);min-height:54px;padding:10px 12px;box-shadow:var(--shadow-sm);transition:transform .08s, border-color .15s, box-shadow .15s}
.opt:hover{border-color:var(--sun)}
.opt:active{transform:scale(.99)}
.opt.right{background:linear-gradient(180deg, var(--ok-bg), #dcedc8);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:linear-gradient(180deg, var(--bad-bg), #f9d9d5);border-color:var(--bad);color:var(--bad)}
.msg{text-align:center;font-size:1.05rem;font-weight:700;min-height:1.6em;margin-top:8px}
.res{text-align:center;padding:14px 0}
.res .score{font-size:3.4rem;font-weight:800;color:var(--teal)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#tabs{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg, #ffffff, var(--paper-2));border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(15,76,92,0.06);display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:4px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:100}
#tabs button{background:transparent;color:var(--ink-mute);font-weight:700;font-size:.66rem;padding:4px 2px;min-height:46px;border-radius:var(--r-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s, color .15s, transform .08s}
#tabs button:active{transform:scale(.94)}
#tabs button span{display:block;font-size:1.18rem;line-height:1.15}
#tabs button .lbl-full{display:block}
#tabs button .lbl-short{display:none}
#tabs button.on{background:linear-gradient(180deg, #eaf3f5, #dde9ec);color:var(--teal);box-shadow:inset 0 1px 2px rgba(15,76,92,0.04)}
@media (max-width:400px){
  #tabs button{font-size:.6rem}
  #tabs button span{font-size:1rem}
  #tabs button .lbl-full{display:none}
  #tabs button .lbl-short{display:block}
  html{font-size:17px}
  .themes{gap:8px}
  .card{padding:14px 10px}
}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:linear-gradient(180deg, #fff, var(--paper-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.stat b{display:block;font-size:1.6rem;color:var(--teal);font-weight:800}
.stat small{color:var(--ink-mute);font-size:.8rem}
.row{background:linear-gradient(180deg, #fff, var(--paper-2));border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow-xs)}
.row .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;align-items:baseline}
.row .bar{margin:8px 0 4px;height:10px}
.row small{color:var(--ink-mute);font-size:.82rem}
.set{background:linear-gradient(180deg, #fff, var(--paper-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.set label{display:block;font-weight:700;color:var(--teal);margin-bottom:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{background:linear-gradient(180deg, #fff, var(--paper-2));border:1px solid var(--line);color:var(--teal);font-weight:700;padding:10px 4px;font-size:.9rem;min-height:48px;box-shadow:var(--shadow-xs);transition:transform .08s, background .15s}
.seg button.on{background:linear-gradient(180deg, var(--teal-2), var(--teal));color:#fff;border-color:var(--teal);box-shadow:var(--shadow-sm)}
.note{color:var(--ink-mute);font-size:.85rem;margin-top:10px;line-height:1.45}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bub{max-width:90%;padding:10px 14px;border-radius:18px;position:relative;background:linear-gradient(180deg, #fff, var(--paper-2));border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.bub.them{align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:linear-gradient(180deg, #eaf3f5, #dde9ec);border-color:#c8dde2;border-bottom-right-radius:6px}
.bub .bs{font-weight:800;color:var(--teal);font-size:1.08rem;padding-right:36px;line-height:1.3}
.bub .br{color:var(--ink-mute);font-size:.82rem;margin-top:3px;padding-right:36px}
.spk{position:absolute;right:6px;top:6px;min-height:36px;width:36px;padding:0;background:transparent;border-radius:50%;font-size:1rem;transition:background .15s, transform .08s}
.spk:hover{background:rgba(15,76,92,0.06)}
.spk:active{transform:scale(.9)}
.hintru{text-align:center;color:var(--ink-soft);margin:6px 0;font-size:.92rem}
.slot{min-height:68px;border:2px dashed var(--line);border-radius:var(--r-md);padding:10px;display:flex;flex-wrap:wrap;gap:8px;background:linear-gradient(180deg, #fff, var(--paper-2));margin:10px 0;align-items:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.tile{min-height:48px;padding:8px 14px;background:linear-gradient(180deg, #fff, var(--paper-2));border:1.5px solid var(--line);color:var(--teal);font-weight:800;font-size:1.05rem;border-radius:var(--r-md);box-shadow:var(--shadow-xs);transition:transform .08s, border-color .15s, box-shadow .15s}
.tile:hover{border-color:var(--sun)}
.tile:active{transform:scale(.96)}
.slot .tile{background:linear-gradient(180deg, var(--teal-2), var(--teal));color:#fff;border-color:var(--teal);box-shadow:var(--shadow-sm)}
.opts.emo{grid-template-columns:repeat(3,1fr)}
.opts.emo .opt{font-size:2.6rem;min-height:96px;padding:6px}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.lt{background:linear-gradient(180deg, #fff, var(--paper-2));border:1.5px solid var(--line);color:var(--teal);font-weight:800;font-size:1.3rem;min-height:56px;padding:6px 2px;box-shadow:var(--shadow-xs);transition:transform .08s, border-color .15s;border-radius:var(--r-sm)}
.lt:hover{border-color:var(--sun)}
.lt.on{background:linear-gradient(180deg, var(--teal-2), var(--teal));color:#fff;border-color:var(--teal);box-shadow:var(--shadow-sm)}
.lesson-block{background:linear-gradient(180deg, #fff, var(--paper-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;position:relative;cursor:pointer;-webkit-user-select:none;user-select:none;box-shadow:var(--shadow-sm);transition:transform .12s, box-shadow .2s, border-color .2s}
.lesson-block:hover{box-shadow:var(--shadow-md);border-color:var(--sun)}
.lesson-block:active{transform:scale(.985)}
.lesson-block h3{color:var(--teal);font-size:1.05rem;margin-bottom:6px;line-height:1.3}
.lesson-block p{color:var(--ink-soft);font-size:.9rem;margin-bottom:8px;line-height:1.4}
.lesson-block small{color:var(--teal);font-size:.85rem;font-weight:700}
.lesson-block .num{display:inline-block;background:linear-gradient(180deg, var(--sun-2), var(--sun));color:#1d2a2e;font-weight:800;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;margin-right:8px;font-size:.85rem;box-shadow:0 1px 3px rgba(242,169,0,0.35)}
.lesson-block .imported-tag{display:inline-block;background:linear-gradient(180deg, #eaf3f5, #dde9ec);color:var(--teal);border:1px solid #c8dde2;font-size:.7rem;padding:2px 8px;border-radius:8px;margin-left:6px;font-weight:700}
@media (max-width:400px){.lesson-block{padding:14px}}
.lesson-content{background:linear-gradient(180deg, #fff, var(--paper-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;overflow-wrap:break-word;word-wrap:break-word;box-shadow:var(--shadow-sm);line-height:1.5}
.lesson-content h2{color:var(--teal);font-size:1.15rem;margin-bottom:12px;margin-top:0}
.lesson-content p{margin-bottom:12px;color:var(--ink)}
.lesson-content .example{background:linear-gradient(180deg, #f4f9fa, #ecf4f6);border-left:4px solid var(--teal);padding:12px 14px;border-radius:10px;margin:12px 0;font-size:.95rem;line-height:1.55}
.lesson-content table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.92rem}
.lesson-content td,.lesson-content th{border:1px solid var(--line);padding:8px 10px;text-align:left;word-break:break-word}
.lesson-content th{background:linear-gradient(180deg, #f4f9fa, #ecf4f6);font-weight:700}
.lesson-content pre{background:linear-gradient(180deg, var(--paper-2), #fff);border:1px solid var(--line-soft);padding:12px;border-radius:10px;overflow-x:auto;font-size:.78rem;line-height:1.4;font-family:ui-monospace,"SF Mono",Consolas,monospace}
.quiz-box{background:linear-gradient(180deg, #fdf8ef, #fbf2e0);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-top:12px;box-shadow:var(--shadow-xs)}
.quiz-box .q{font-size:1rem;margin-bottom:10px;text-align:left;color:var(--ink)}
.quiz-box .opts{gap:6px}
.quiz-box .opt{min-height:46px;font-size:1rem}
.example-box{background:linear-gradient(180deg, var(--paper-2), #fff);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:12px;margin:12px 0}
.example-box pre{background:transparent;padding:0;margin:0 0 10px;max-height:160px;overflow:auto;font-size:.72rem;line-height:1.45;font-family:ui-monospace,"SF Mono",Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.copy-example{width:100%;background:linear-gradient(180deg, #fff, var(--paper-2));border:1px solid var(--line);color:var(--teal);font-weight:700;min-height:42px;font-size:.88rem;box-shadow:var(--shadow-xs);transition:transform .08s, border-color .15s}
.copy-example:hover{border-color:var(--sun)}
.copy-example:active{transform:scale(.98)}
.file-label{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg, #fff, var(--paper-2));border:1.5px dashed var(--line);color:var(--teal);font-weight:700;padding:14px 16px;border-radius:var(--r-md);cursor:pointer;margin:10px 0;min-height:54px;transition:border-color .15s, background .15s}
.file-label:hover{border-color:var(--sun);background:#fffef9}
.file-label input{display:none}

/* Кнопка «Добавить» наверху */
.add-btn{
  display:flex;align-items:center;gap:8px;
  width:100%;margin:0 0 14px;
  background:linear-gradient(180deg, #fff, var(--paper-2));
  border:1px solid var(--line);
  color:var(--teal);font-weight:700;font-size:.95rem;
  min-height:48px;padding:10px 16px;
  box-shadow:var(--shadow-xs);
  border-radius:var(--r-md);
  justify-content:center;
  transition:transform .08s, border-color .15s, box-shadow .15s;
}
.add-btn:hover{border-color:var(--sun);box-shadow:var(--shadow-sm)}
.add-btn:active{transform:scale(.98)}

.manual-paste-box{
  margin:12px 0;padding:14px;
  background:linear-gradient(180deg, #eaf3f5, #dde9ec);
  border:2px dashed var(--teal);
  border-radius:var(--r-md);
  animation:slideDown .2s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.manual-paste-box .hint{
  color:var(--teal);font-weight:700;font-size:.9rem;
  text-align:center;margin-bottom:10px;line-height:1.4;
}
.manual-paste-box .hint b{background:var(--teal);color:#fff;padding:2px 8px;border-radius:6px;font-weight:800}
.manual-paste-box textarea{
  width:100%;min-height:140px;
  font-family:ui-monospace,"SF Mono",Consolas,monospace;
  font-size:16px;line-height:1.4;padding:12px;
  border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  resize:vertical;-webkit-user-select:text;user-select:text;-webkit-appearance:none;outline:none;
}
.manual-paste-box textarea:focus{border-color:var(--sun);box-shadow:0 0 0 3px rgba(242,169,0,0.15)}
.manual-paste-box .parser-status{
  font-size:.85rem;color:var(--ink-soft);margin-top:8px;text-align:center;font-weight:600;
}
.manual-paste-box .parser-status.ok{color:var(--ok)}
.manual-paste-box .parser-status.bad{color:var(--bad)}

/* Обмен материалами */
.share-group{margin-bottom:14px}
.share-group h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.share-group h2 small{color:var(--ink-mute);font-size:.8rem;font-weight:400}
.share-item{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg, #fff, var(--paper-2));border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow-xs)}
.share-item label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.share-item input[type=checkbox]{width:22px;height:22px;accent-color:var(--teal);flex-shrink:0}
.share-item .si-name{font-weight:700;color:var(--teal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.share-item .si-meta{display:block;color:var(--ink-mute);font-size:.8rem;font-weight:400}
.share-item .si-del{background:transparent;border:1px solid var(--line);color:var(--bad);min-height:40px;min-width:40px;padding:0;border-radius:10px;flex-shrink:0}
.share-empty{color:var(--ink-mute);font-size:.9rem;margin:0 0 10px}
.share-preview{list-style:none;padding:0;margin:10px 0;font-size:.92rem}
.share-preview li{padding:6px 0;border-bottom:1px solid var(--line-soft)}
.share-preview li.bad{color:var(--bad)}
.share-opt{display:flex;align-items:center;gap:8px;font-size:.92rem;margin:8px 0;cursor:pointer}
.share-opt input{width:20px;height:20px;accent-color:var(--teal)}

@media (min-width:600px){html{font-size:20px}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs">
  <button data-p="home"><span>🏠</span><span class="lbl-full">Темы</span><span class="lbl-short">Темы</span></button>
  <button data-p="lesson"><span>📖</span><span class="lbl-full">Урок</span><span class="lbl-short">Урок</span></button>
  <button data-p="dialogs"><span>💬</span><span class="lbl-full">Диалоги</span><span class="lbl-short">Диал.</span></button>
  <button data-p="tests"><span>📝</span><span class="lbl-full">Тесты</span><span class="lbl-short">Тесты</span></button>
  <button data-p="alphabet"><span>🔤</span><span class="lbl-full">Азбука</span><span class="lbl-short">Азбука</span></button>
  <button data-p="stats"><span>📊</span><span class="lbl-full">Успехи</span><span class="lbl-short">Успехи</span></button>
  <button data-p="settings"><span>⚙️</span><span class="lbl-full">Настройки</span><span class="lbl-short">Опции</span></button>
</nav>
<script>
/* ============ ВСТРОЕННЫЕ ДАННЫЕ ============ */

/* ==== ОЗВУЧКА ==== */
const SIZES = {small:'15px', normal:'18px', large:'22px'};
function applyTextSize(){ document.documentElement.style.fontSize = SIZES[settings.textSize] || '18px'; }
const RATE = {slow:.6, normal:.9, fast:1.15};
let currentAudio = null;
async function speak(text, rate) {
  if (!text) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  // 1 — Netlify Function (свой домен, без CORS)
  if (navigator.onLine) {
    try {
      const audio = new Audio('/.netlify/functions/tts?text=' + encodeURIComponent(text));
      audio.playbackRate = rate || RATE[settings.speed];
      currentAudio = audio;
      await audio.play();
      return;
    } catch(e) {}
  }
  // 2 — браузерный SpeechSynthesis
  if (!('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'sr-RS'; u.rate = rate || RATE[settings.speed];
    const voices = speechSynthesis.getVoices();
    const v = voices.find(v => v.lang.startsWith('sr')) || voices.find(v => v.lang.startsWith('hr')) || voices.find(v => v.lang.startsWith('bs'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e) {}
}

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
// Чужие уроки могут прийти от других пользователей — убираем скрипты и обработчики событий
function sanitizeHtml(html){
  const doc = new DOMParser().parseFromString(String(html), 'text/html');
  doc.body.querySelectorAll('script,style,iframe,object,embed,link,meta,form,base').forEach(n => n.remove());
  doc.body.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => {
    if (/^on/i.test(a.name) || /^\s*(javascript|data):/i.test(a.value)) n.removeAttribute(a.name);
  }));
  return doc.body.innerHTML;
}
const plural = (n,a,b,c) => { const m=n%100, k=n%10; return (m>10&&m<20)?c:(k===1?a:(k>=2&&k<=4?b:c)); };

/* ==== ВИКТОРИНА ==== */
function quiz(id){
  setTab('home');
  const t = getAllWords().find(x=>x.id===id);
  if (!t) return home();
  const order = shuffle(t.words.map((_,i)=>i));
  let n = 0, right = 0;
  const ask = () => {
    if (n >= order.length) return result();
    const w = t.words[order[n]];
    const emo = Math.random() < 0.5;
    let wrong;
    if (emo){
      const seen = new Set([w.e]); wrong = [];
      for (const x of shuffle(t.words)){ if (!seen.has(x.e)){ seen.add(x.e); wrong.push(x); if (wrong.length===2) break; } }
    } else wrong = shuffle(t.words.filter(x=>x.sr!==w.sr)).slice(0,2);
    const opts = shuffle([w,...wrong]);
    $app.innerHTML = `
      <div class="top"><button class="back" id="home">← Темы</button><span class="count">${n+1} из ${order.length}</span></div>
      <div class="bar"><i style="width:${n/order.length*100}%"></i></div>
      ${emo
        ? `<div class="card compact"><div class="sr">${esc(w.srStress || w.sr)}</div><button class="back" id="hear0" style="margin-top:12px">🔊</button></div><p class="q">Выберите картинку</p>`
        : `<div class="card compact"><div class="big">${esc(w.e||'📖')}</div><div class="ru">${esc(w.ru)}</div></div><p class="q">Как это по-сербски?</p>`}
      <div class="opts${emo?' emo':''}">${opts.map(o=>`<button class="opt" data-sr="${esc(o.sr)}">${esc(emo?o.e:(o.srStress||o.sr))}</button>`).join('')}</div>
      <div class="msg" id="msg"></div>
      <div class="nav hide" id="nx"><button class="light" id="hear">🔊 Послушать</button><button id="go">Дальше →</button></div>`;
    document.getElementById('home').onclick = home;
    const h0 = document.getElementById('hear0'); if (h0) h0.onclick = () => speak(w.sr);
    let answered = false;
    $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if (answered) return; answered = true;
      const ok = b.dataset.sr === w.sr, r = wordRec(w.sr);
      if (ok){ right++; r.ok++; b.classList.add('right'); document.getElementById('msg').textContent='✅ Верно!'; }
      else { r.bad++; b.classList.add('wrong'); $app.querySelectorAll('.opt').forEach(x=>{ if(x.dataset.sr===w.sr) x.classList.add('right'); });
        document.getElementById('msg').textContent = emo ? 'Правильно: '+w.e+' '+w.ru : 'Правильно: '+(w.srStress||w.sr); }
      touchDay(); saveStats();
      document.getElementById('nx').classList.remove('hide');
      document.getElementById('hear').onclick = () => speak(w.sr);
      document.getElementById('go').onclick = () => { n++; ask(); };
    });
  };
  const result = () => {
    stats.tests.push({id,right,total:order.length,date:today()});
    if (stats.tests.length>300) stats.tests = stats.tests.slice(-300);
    saveStats();
    const good = right/order.length >= 0.8;
    $app.innerHTML = `
      <div class="res"><div style="font-size:4rem">${good?'🎉':'💪'}</div>
      <div class="score">${right} из ${order.length}</div>
      <p class="sub">${good?'Отлично!':'Хорошо! Попробуйте ещё раз.'}</p></div>
      <div class="nav"><button class="light" id="again">Ещё раз</button><button id="themes">Другие темы</button></div>`;
    document.getElementById('again').onclick = () => quiz(id);
    document.getElementById('themes').onclick = home;
  };
  ask();
}

function openBlock(lid, idx){
  const lesson = getLesson(lid);
  const block = lesson.blocks[idx];
  if (!block) return;
  let qIndex = 0, right = 0;
  const total = (block.quiz||[]).length;
  $app.innerHTML = `
    <div class="top"><button class="back" id="back">← Блоки</button><span class="count">Блок ${idx+1} из ${lesson.blocks.length}</span></div>
    <div class="lesson-content">${lesson.imported ? sanitizeHtml(block.content) : block.content}</div>
    ${total>0?'<div class="quiz-box" id="quizBox"></div>':''}
    <div class="nav">
      <button class="light" id="back2">← Назад</button>
      <button id="next" disabled>${idx+1<lesson.blocks.length?'Дальше →':'Готово'}</button>
    </div>`;
  document.getElementById('back').onclick = () => openLesson(lid);
  document.getElementById('back2').onclick = () => openLesson(lid);
  const nextBtn = document.getElementById('next');
  const box = document.getElementById('quizBox');
  if (!box) {
    stats.lesson = stats.lesson || {}; stats.lesson[lid+':'+idx] = true; saveStats();
    nextBtn.disabled = false;
    nextBtn.onclick = () => { if (idx+1 < lesson.blocks.length) openBlock(lid, idx+1); else openLesson(lid); };
    return;
  }
  const showQuiz = () => {
    if (qIndex >= total) {
      const passed = right === total;
      if (passed) { stats.lesson = stats.lesson || {}; stats.lesson[lid+':'+idx] = true; saveStats(); }
      box.innerHTML = `
        <p style="color:${passed?'var(--ok)':'var(--bad)'};font-weight:700;font-size:1.05rem;text-align:center">
          ${passed ? '✅ Блок пройден! ' : '❌ Не всё верно. '}${right} из ${total}
        </p>
        ${passed ? '' : '<p class="note" style="text-align:center">Повторите блок, чтобы он засчитался.</p>'}
        ${passed ? '' : '<div class="nav" style="margin-top:10px"><button id="retryBlock">↻ Повторить блок</button></div>'}`;
      nextBtn.disabled = !passed;
      if (passed) nextBtn.onclick = () => { if (idx+1 < lesson.blocks.length) openBlock(lid, idx+1); else openLesson(lid); };
      const retry = box.querySelector('#retryBlock');
      if (retry) retry.onclick = () => openBlock(lid, idx);
      return;
    }
    const q = block.quiz[qIndex];
    box.innerHTML = `
      <p class="q"><strong>Вопрос ${qIndex+1}:</strong> ${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
      <div class="msg" id="qmsg"></div>`;
    let answered = false;
    box.querySelectorAll('.opt').forEach(b=>{
      b.onclick = () => {
        if (answered) return; answered = true;
        const i = +b.dataset.i;
        if (i === q.a) { right++; b.classList.add('right'); document.getElementById('qmsg').textContent='✅ Верно!'; }
        else { b.classList.add('wrong'); box.querySelectorAll('.opt')[q.a].classList.add('right');
          document.getElementById('qmsg').textContent = '❌ Правильный ответ: ' + q.opts[q.a]; }
        qIndex++; setTimeout(showQuiz, 900);
      };
    });
  };
  showQuiz();
}

function finalTest(lid){
  setTab('lesson');
  const lesson = getLesson(lid);
  const allQ = [];
  lesson.blocks.forEach(b => (b.quiz||[]).forEach(q => allQ.push(q)));
  if (!allQ.length) { alert('В этом уроке нет вопросов для теста.'); return; }
  const order = shuffle(allQ);
  let n = 0, right = 0;
  const ask = () => {
    if (n >= order.length) return result();
    const q = order[n];
    $app.innerHTML = `
      <div class="top"><button class="back" id="back">← Урок</button><span class="count">Тест ${n+1} из ${order.length}</span></div>
      <div class="bar"><i style="width:${n/order.length*100}%"></i></div>
      <div class="quiz-box" style="margin-top:16px">
        <p class="q"><strong>${esc(q.q)}</strong></p>
        <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
        <div class="msg" id="msg"></div>
      </div>`;
    document.getElementById('back').onclick = () => openLesson(lid);
    let answered = false;
    $app.querySelectorAll('.opt').forEach(b=>{
      b.onclick = () => {
        if (answered) return; answered = true;
        const i = +b.dataset.i;
        if (i === q.a) { right++; b.classList.add('right'); document.getElementById('msg').textContent='✅ Верно!'; }
        else { b.classList.add('wrong'); $app.querySelectorAll('.opt')[q.a].classList.add('right');
          document.getElementById('msg').textContent = '❌ Правильный ответ: ' + q.opts[q.a]; }
        setTimeout(() => { n++; ask(); }, 900);
      };
    });
  };
  const result = () => {
    const total = order.length;
    const pct = Math.round(right/total*100);
    stats.tests.push({id:'final-'+lid,right,total,date:today()});
    saveStats();
    $app.innerHTML = `
      <div class="res"><div style="font-size:4rem">${pct>=80?'🎉':'💪'}</div>
      <div class="score">${right} / ${total}</div><p class="sub">${pct}%</p>
      <p>${pct>=80?'Отлично! Материал усвоен.':pct>=60?'Хорошо, но стоит повторить некоторые блоки.':'Рекомендуется пройти урок заново.'}</p></div>
      <div class="nav"><button class="light" id="again">Пройти ещё раз</button><button id="lesson">К уроку</button></div>`;
    document.getElementById('again').onclick = () => finalTest(lid);
    document.getElementById('lesson').onclick = () => openLesson(lid);
  };
  ask();
}

function downloadLesson(lid){
  const lesson = getLesson(lid);
  const data = { ...lesson }; delete data.imported;
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (data.id||'lesson') + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ==== ВАЛИДАЦИЯ ==== */
function validateLesson(data){
  if (!data || typeof data !== 'object') return 'JSON должен быть объектом';
  if (!data.title) return 'Отсутствует поле "title"';
  if (!Array.isArray(data.blocks) || data.blocks.length === 0) return 'Поле "blocks" должно быть непустым массивом';
  for (let i=0; i<data.blocks.length; i++){
    const b = data.blocks[i];
    if (!b.title) return `Блок ${i+1}: отсутствует "title"`;
    if (!b.content) return `Блок ${i+1}: отсутствует "content"`;
    if (!Array.isArray(b.quiz)) return `Блок ${i+1}: поле "quiz" должно быть массивом`;
    for (let j=0; j<b.quiz.length; j++){
      const q = b.quiz[j];
      if (!q.q) return `Блок ${i+1}, вопрос ${j+1}: отсутствует "q"`;
      if (!Array.isArray(q.opts) || q.opts.length < 2) return `Блок ${i+1}, вопрос ${j+1}: "opts" ≥2 вариантов`;
      if (typeof q.a !== 'number' || q.a < 0 || q.a >= q.opts.length) return `Блок ${i+1}, вопрос ${j+1}: некорректный индекс "a"`;
    }
  }
  return null;
}
function validateWords(data){
  if (!data || typeof data !== 'object') return 'JSON должен быть объектом';
  if (!data.name) return 'Отсутствует поле "name"';
  if (!Array.isArray(data.words) || data.words.length === 0) return 'Поле "words" должно быть непустым массивом';
  for (let i=0;i<data.words.length;i++){
    const w = data.words[i];
    if (!w.ru) return `Слово ${i+1}: нужно поле "ru"`;
    if (!w.sr) return `Слово ${i+1}: нужно поле "sr"`;
  }
  return null;
}
function validateDialogs(data){
  if (!data || typeof data !== 'object') return 'JSON должен быть объектом';
  if (!data.name) return 'Отсутствует поле "name"';
  if (!Array.isArray(data.lines) || data.lines.length === 0) return 'Поле "lines" должно быть непустым массивом';
  for (let i=0;i<data.lines.length;i++){
    const l = data.lines[i];
    if (!l.sr && !l.you) return `Строка ${i+1}: нужен "sr" или "you"`;
    if (!l.ru) return `Строка ${i+1}: отсутствует "ru"`;
  }
  if (!data.lines.some(l=>l.you)) return 'Диалог должен содержать хотя бы одну реплику "you"';
  return null;
}

          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 1500))

    const ta2 = document.getElementById('manualCopyTA');
    ta2.focus(); ta2.select();
    setMsg('Автокопирование недоступно. Текст выделен — скопируйте вручную.', 'ok');
  };
  document.getElementById('back').onclick = cfg.back;
  document.getElementById('cancelBtn').onclick = cfg.back;
  document.getElementById('fileInput').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => handleText(String(reader.result), f.name);
    reader.onerror = () => setMsg('Ошибка чтения файла', 'bad');
    reader.readAsText(f);
  };
  importGo.onclick = () => {
    if (!pendingData) return;
    const data = pendingData;
    const arr = store.load(cfg.storeKey, []);
    if (!data.id) data.id = cfg.idPrefix + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
    if (arr.some(x => x.id === data.id) || (type === 'lesson' && data.id === BUILTIN_LESSON.id)) {
      setMsg('Элемент с таким id уже существует. Измените "id".', 'bad'); return;
    }
    data.imported = true;
    arr.push(data);
    if (!store.save(cfg.storeKey, arr)) { setMsg('Не удалось сохранить (localStorage переполнен)', 'bad'); return; }
    setMsg('✅ Добавлено: «' + (data.title || data.name) + '»', 'ok');
    setTimeout(cfg.afterImport, 800);
  };
}

const SHARE_TYPES = [
  { key:'words',   storeKey:'sr_words_v1',   label:'Темы слов', emoji:'📚', validate:validateWords,
    name:x=>x.name,  meta:x=>x.words.length+' '+plural(x.words.length,'слово','слова','слов'), builtinIds:()=>BUILTIN_WORDS.map(x=>x.id) },
  { key:'dialogs', storeKey:'sr_dialogs_v1', label:'Диалоги',   emoji:'💬', validate:validateDialogs,
    name:x=>x.name,  meta:x=>x.lines.length+' '+plural(x.lines.length,'реплика','реплики','реплик'), builtinIds:()=>BUILTIN_DIALOGS.map(x=>x.id) },
  { key:'lessons', storeKey:'sr_lessons_v1', label:'Уроки',     emoji:'📖', validate:validateLesson,
    name:x=>x.title, meta:x=>x.blocks.length+' '+plural(x.blocks.length,'блок','блока','блоков'), builtinIds:()=>[BUILTIN_LESSON.id] }
];
const BUNDLE_FORMAT = 'words-rs-bundle';

const stripImported = x => { const c = { ...x }; delete c.imported; return c; };

function buildBundle(selected){
  const b = { format:BUNDLE_FORMAT, version:1, exportedAt:new Date().toISOString() };
  SHARE_TYPES.forEach(t => {
    b[t.key] = store.load(t.storeKey, []).filter(x => selected.has(t.key+':'+x.id)).map(stripImported);
  });
  return b;
}

// Принимает пакет (bundle) или одиночную тему/диалог/урок. Возвращает {words,dialogs,lessons} или строку-ошибку.
function parseShared(data){
  if (!data || typeof data !== 'object' || Array.isArray(data)) return 'JSON должен быть объектом';
  if (data.format === BUNDLE_FORMAT || (!data.name && !data.title && SHARE_TYPES.some(t => Array.isArray(data[t.key])))) {
    const out = {};
    SHARE_TYPES.forEach(t => { out[t.key] = Array.isArray(data[t.key]) ? data[t.key] : []; });
    return out;
  }
  if (Array.isArray(data.blocks)) return { words:[], dialogs:[], lessons:[data] };
  if (Array.isArray(data.lines))  return { words:[], dialogs:[data], lessons:[] };
  if (Array.isArray(data.words))  return { words:[data], dialogs:[], lessons:[] };
  return 'Не похоже на материалы приложения: нет "words", "lines" или "blocks"';
}

function downloadJson(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

      const file = new File([JSON.stringify(b, null, 2)], fileName(), {type:'application/json'});
      try {
        if (navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:'Материалы для сербского'});
        else await navigator.share({title:'Материалы для сербского', text:JSON.stringify(b)});
      } catch (e) { if (e.name !== 'AbortError') say(expMsg, 'Не удалось поделиться — используйте «Скачать файл»', 'bad'); }
    };

    let data;

    say(impMsg, okRows.length < rows.length ? 'Элементы с ошибками будут пропущены' : '');
    document.getElementById('impGo').onclick = () => {
      const replace = !!(document.getElementById('impReplace') || {}).checked;
      let added = 0, replaced = 0, skipped = 0;
      for (const t of SHARE_TYPES) {
        const arr = store.load(t.storeKey, []);
        const builtin = new Set(t.builtinIds());
        okRows.filter(r => r.t === t).forEach(r => {
          const item = stripImported(r.x);
          item.imported = true;
          if (!item.id || builtin.has(item.id)) item.id = t.key + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
          const at = arr.findIndex(x => x.id === item.id);
          if (at < 0) { arr.push(item); added++; }
          else if (replace) { arr[at] = item; replaced++; }
          else skipped++;
        });
        if (!store.save(t.storeKey, arr)) { say(impMsg, 'Не удалось сохранить (память браузера переполнена)', 'bad'); return; }
      }
      sharePage();
      say(document.getElementById('impMsg'),
        '✅ Добавлено: ' + added + (replaced ? ', заменено: ' + replaced : '') + (skipped ? ', пропущено: ' + skipped : ''), 'ok');
    };
  };
  let timer = null;
  ta.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => handle(ta.value), 400); });
  document.getElementById('impFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;

    reader.onerror = () => say(impMsg, 'Ошибка чтения файла', 'bad');
    reader.readAsText(f);
  };
}

    <div class="themes">
      ${dialogs.map(d=>`
        <button class="theme" data-id="${esc(d.id)}">
          ${importedIds.has(d.id)?'<span class="imported-tag">импорт</span>':''}
          ${dr(d.id)&&dr(d.id).done?'<span class="star">⭐</span>':''}

function dialog(id){
  setTab('dialogs');
  const d = getAllDialogs().find(x=>x.id===id);
  if (!d) return dialogsPage();
  const L = d.lines;
  stats.dlg = stats.dlg || {};
  const rec = stats.dlg[id] || (stats.dlg[id] = {done:0,errors:0});
  let i = 0, runErr = 0;
  $app.innerHTML = `
    <div class="top"><button class="back" id="home">← Диалоги</button><span class="count">${esc(d.emoji||'💬')} ${esc(d.name)}</span></div>
    <div class="bar"><i id="pb" style="width:0"></i></div>
    <div class="chat" id="chat"></div><div id="act"></div>`;
  document.getElementById('home').onclick = dialogsPage;
  const chat = document.getElementById('chat'), act = document.getElementById('act'), pb = document.getElementById('pb');
  const toEnd = () => setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),60);
  const bubble = (who, sr, ru, stress) => {
    const b = document.createElement('div');
    b.className = 'bub ' + who;
    b.innerHTML = `<div class="bs">${esc(stress || sr)}</div><div class="br">${esc(ru||'')}</div><button class="spk" aria-label="Послушать">🔊</button>`;
    b.querySelector('.spk').onclick = () => speak(sr);
    chat.appendChild(b);
  };
  const normW = s => String(s||'').toLowerCase().replace(/[.,!?;:"„“”'’…()\-–—]/g,' ').split(/\s+/).filter(Boolean);
  const step = () => {
    while (i<L.length && !L[i].you){ bubble('them', L[i].sr, L[i].ru, L[i].srStress); i++; }
    pb.style.width = (i/L.length*100)+'%';
    if (i>=L.length) return finish();
    turn(L[i]); toEnd();
  };
  const turn = l => {
    const variants = [l.you,...(l.alt||[])];
    const main = normW(l.you), items = main.slice(), have = new Set(main);
    [...variants.slice(1).flatMap(normW), ...(l.extra||[]).flatMap(normW)].forEach(w=>{ if(!have.has(w)){ have.add(w); items.push(w); } });
    if (!(l.extra && l.extra.length)){
      shuffle([...new Set(L.flatMap(x=>normW(x.you||x.sr)))].filter(w=>!have.has(w))).slice(0,4).forEach(w=>items.push(w));
    }
    const pool = shuffle(items.map(w=>({w}))), sel = [];
    let te = 0;
    act.innerHTML = `
      <p class="hintru">Скажите: <b>${esc(l.ru||'')}</b></p>
      <div class="slot" id="slot"></div>
      <div class="tiles" id="tiles"></div>
      <div class="msg" id="m"></div>
      <div class="nav">
        <button class="light" id="reset">Сбросить</button>
        <button id="check">Проверить</button>
        <button class="light wide hide" id="show">Показать ответ</button>
      </div>`;
    const slot = document.getElementById('slot'), tiles = document.getElementById('tiles'), m = document.getElementById('m');
    const draw = () => {
      slot.innerHTML = sel.length ? sel.map(k=>`<button class="tile" data-k="${k}">${esc(pool[k].w)}</button>`).join('') : '<span class="note" style="margin:0">Нажимайте на слова ниже</span>';
      tiles.innerHTML = pool.map((p,k)=>sel.includes(k)?'':`<button class="tile" data-k="${k}">${esc(p.w)}</button>`).join('');
      slot.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ sel.splice(sel.indexOf(+b.dataset.k),1); draw(); });
      tiles.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ sel.push(+b.dataset.k); m.textContent=''; draw(); });
    };
    draw();
    const accept = text => {
      bubble('me', text, l.ru, l.youStress); speak(text); i++;
      act.innerHTML = `<div class="nav"><button class="light" id="hear">🔊 Послушать</button><button id="go">${i>=L.length?'Завершить':'Дальше →'}</button></div>`;
      document.getElementById('hear').onclick = () => speak(text);
      document.getElementById('go').onclick = step;
      toEnd();
    };
    document.getElementById('reset').onclick = () => { sel.length = 0; m.textContent = ''; draw(); };
    document.getElementById('check').onclick = () => {
      m.style.color = 'var(--bad)';
      if (!sel.length){ m.textContent = 'Составьте фразу из слов'; return; }
      const got = sel.map(k=>pool[k].w);
      const hit = variants.find(v=>{ const t = normW(v); return t.length===got.length && t.every((x,j)=>x===got[j]); });
      if (hit) return accept(hit);
      te++; runErr++; rec.errors++; saveStats();
      m.textContent = 'Не совсем. Попробуйте ещё';
      if (te>=2) document.getElementById('show').classList.remove('hide');
    };
    document.getElementById('show').onclick = () => accept(l.you);
  };
  const finish = () => {
    rec.done++; touchDay(); saveStats();
    act.innerHTML = `
      <div class="res"><div style="font-size:3.4rem">${runErr?'💪':'🎉'}</div>
      <div class="score" style="font-size:2rem">Диалог пройден</div>
      <p class="sub">${runErr?'Ошибок: '+runErr:'Без ошибок!'}</p></div>
      <div class="nav"><button class="light" id="again">Ещё раз</button><button id="others">Другие диалоги</button></div>`;
    document.getElementById('again').onclick = () => dialog(id);
    document.getElementById('others').onclick = dialogsPage;
    toEnd();
  };
  step();
}

  lat: [['A','ananas','ананас'],['B','banana','банан'],['C','cvet','цветок'],['Č','čaj','чай'],['Ć','ćebe','одеяло'],['D','dan','день'],['Dž','džep','карман'],['Đ','đak','ученик'],['E','ekran','экран'],['F','fotelja','кресло'],['G','grad','город'],['H','hleb','хлеб'],['I','ime','имя'],['J','jabuka','яблоко'],['K','kafa','кофе'],['L','lopta','мяч'],['Lj','ljubav','любовь'],['M','mama','мама'],['N','nos','нос'],['Nj','njiva','поле'],['O','oko','глаз'],['P','pas','собака'],['R','riba','рыба'],['S','sunce','солнце'],['Š','šuma','лес'],['T','tata','папа'],['U','ulica','улица'],['V','voda','вода'],['Z','zub','зуб'],['Ž','žaba','жаба']],
  cyr: [['А','ананас','ананас'],['Б','банана','банан'],['В','вода','вода'],['Г','град','город'],['Д','дан','день'],['Ђ','ђак','ученик'],['Е','екран','экран'],['Ж','жаба','жаба'],['З','зуб','зуб'],['И','име','имя'],['Ј','јабука','яблоко'],['К','кафа','кофе'],['Л','лопта','мяч'],['Љ','љубав','любовь'],['М','мама','мама'],['Н','нос','нос'],['Њ','њива','поле'],['О','око','глаз'],['П','пас','собака'],['Р','риба','рыба'],['С','сунце','солнце'],['Т','тата','папа'],['Ћ','ћебе','одеяло'],['У','улица','улица'],['Ф','фотеља','кресло'],['Х','хлеб','хлеб'],['Ц','цвет','цветок'],['Ч','чај','чай'],['Џ','џеп','карман'],['Ш','шума','лес']]
};
let alphaScript = 'lat', alphaSel = 0;
function alphabetPage(){ setTab('alphabet'); renderAlpha(); }
function renderAlpha(){
  const list = ABC[alphaScript];
  const [L, w, ru] = list[alphaSel];
  $app.innerHTML = `
    <h1>Азбука</h1><p class="sub">Нажмите на букву, чтобы услышать слово</p>
    <div class="seg" style="grid-template-columns:1fr 1fr;margin-bottom:12px">
      <button class="${alphaScript==='lat'?'on':''}" data-s="lat">Latinica</button>
      <button class="${alphaScript==='cyr'?'on':''}" data-s="cyr">Ћирилица</button>
    </div>
    <div class="abc">${list.map((x,i)=>`<button class="lt${i===alphaSel?' on':''}" data-i="${i}">${esc(x[0])}</button>`).join('')}</div>
    <div class="card" style="margin-top:12px">
      <div class="big">${esc(L)}</div>
      <div class="sr">${esc(w)}</div>
      <div class="ru">${esc(ru)}</div>
      <button class="say" id="sayW">🔊 Слово</button>
      <button class="say" id="sayL" style="background:linear-gradient(180deg,var(--teal-2),var(--teal));color:#fff;box-shadow:var(--shadow-sm)">🔊 Буква</button>
    </div>
    <div class="nav">
      <button class="light" id="pv" ${alphaSel===0?'disabled':''}>← Назад</button>
      <button id="nx" ${alphaSel===list.length-1?'disabled':''}>Дальше →</button>
    </div>`;
  $app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ alphaScript=b.dataset.s; alphaSel=0; renderAlpha(); });
  $app.querySelectorAll('.lt').forEach(b=>b.onclick=()=>{ alphaSel=+b.dataset.i; renderAlpha(); speak(ABC[alphaScript][alphaSel][1]); });
  document.getElementById('sayW').onclick = () => speak(w);
  document.getElementById('sayL').onclick = () => speak(L);
  document.getElementById('pv').onclick = () => { alphaSel--; renderAlpha(); speak(ABC[alphaScript][alphaSel][1]); };
  document.getElementById('nx').onclick = () => { alphaSel++; renderAlpha(); speak(ABC[alphaScript][alphaSel][1]); };
}

/* ==== УСПЕХИ ==== */
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function streak(){
  let n = 0; const d = new Date();
  if (!stats.days[fmt(d)]) d.setDate(d.getDate()-1);
  while (stats.days[fmt(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function statsPage(){
  setTab('stats');
  const words = getAllWords();
  const dialogs = getAllDialogs();
  const all = words.flatMap(t=>t.words);
  const total = new Set(all.map(w=>w.sr)).size;
  const seen = new Set(all.filter(w=>stats.words[w.sr]?.seen>0).map(w=>w.sr)).size;
  const ok = Object.values(stats.words).reduce((a,r)=>a+r.ok,0);
  const bad = Object.values(stats.words).reduce((a,r)=>a+r.bad,0);
  const pct = ok+bad ? Math.round(ok/(ok+bad)*100)+'%' : '—';
  const dlgStats = stats.dlg || {};
  const dlgDone = dialogs.filter(d => (dlgStats[d.id]?.done||0) > 0).length;
  const dlgErrors = dialogs.reduce((s,d) => s + (dlgStats[d.id]?.errors || 0), 0);
  $app.innerHTML = `
    <h1>Мои успехи</h1>
    <div class="stats">
      <div class="stat"><b>${seen} / ${total}</b><small>слов просмотрено</small></div>
      <div class="stat"><b>${pct}</b><small>верных ответов</small></div>
      <div class="stat"><b>${stats.tests.length}</b><small>${plural(stats.tests.length,'тест','теста','тестов')}</small></div>
      <div class="stat"><b>${streak()}</b><small>${plural(streak(),'день подряд','дня подряд','дней подряд')}</small></div>
    </div>
    <h2>Уроки</h2>
    ${getAllLessons().map(l=>{
      const p = courseDone(l);
      return `<div class="row"><div class="t"><span>${esc(l.emoji||'📖')} ${esc(l.title)}</span><span>${p.done}/${p.total}</span></div>
        <div class="bar"><i style="width:${p.total?p.done/p.total*100:0}%"></i></div></div>`;
    }).join('')}
    <h2>Диалоги <small style="color:var(--ink-mute);font-size:.85rem;font-weight:400">(пройдено ${dlgDone} из ${dialogs.length}${dlgErrors?', ошибок: '+dlgErrors:''})</small></h2>
    ${dialogs.map(d => {
      const r = dlgStats[d.id] || {done:0,errors:0};
      const isDone = r.done > 0;
      return `<div class="row"><div class="t">
        <span>${esc(d.emoji||'💬')} ${esc(d.name)}</span>
        <span style="color:${isDone?'var(--ok)':'var(--ink-mute)'};font-size:.9rem">${isDone ? 'пройден ×'+r.done : 'не пройден'}</span>
      </div><small>${isDone ? 'ошибок: '+r.errors : 'начните с вкладки «Диалоги»'}</small></div>`;
    }).join('')}
    <h2>По темам слов</h2>
    ${words.map(t=>{
      const s = t.words.filter(w=>stats.words[w.sr]?.seen>0).length;
      return `<div class="row"><div class="t"><span>${esc(t.emoji||'📚')} ${esc(t.name)}</span></div>
        <div class="bar"><i style="width:${s/t.words.length*100}%"></i></div><small>просмотрено ${s} из ${t.words.length}</small></div>`;
    }).join('')}
  `;
}
