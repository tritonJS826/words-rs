<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сербский для жизни</title>
<meta name="description" content="Учите сербский язык: слова, уроки, диалоги и азбука. Работает на телефоне и без интернета.">
<meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1517" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Srpski">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* Тема применяется до отрисовки, чтобы не было вспышки светлого фона */
try { const t = (JSON.parse(localStorage.getItem('sr_settings')||'{}').theme)||'auto'; if (t !== 'auto') document.documentElement.dataset.theme = t; } catch(e) {}
</script>
<style>
/* ================= ДИЗАЙН-ТОКЕНЫ ================= */
:root{
  color-scheme:light;
  --bg:#F7F4EE;--surface:#FFFFFF;--surface-2:#FBF9F5;--surface-3:#F1ECE2;
  --ink:#17252A;--ink-soft:#46585E;--ink-mute:#7B8A8F;
  --teal:#0F4C5C;--teal-2:#14697E;--teal-3:#2A8598;
  --primary:#0F4C5C;--primary-2:#14697E;--on-primary:#FFFFFF;
  --tint:#E7F0F2;--tint-line:#CDE0E5;
  --sun:#F2A900;--sun-2:#FFC53D;--on-sun:#1D2A2E;--sun-tint:#FFF4D6;
  --ok:#2E7D32;--ok-bg:#E8F4E9;--bad:#B3261E;--bad-bg:#FCEBE9;
  --line:#E6DFD1;--line-soft:#EFEAE0;
  --paper:var(--bg);--paper-2:var(--surface-2);
  --shadow-xs:0 1px 2px rgba(23,37,42,.05);
  --shadow-sm:0 1px 2px rgba(23,37,42,.04),0 2px 8px rgba(23,37,42,.06);
  --shadow-md:0 2px 4px rgba(23,37,42,.05),0 10px 24px rgba(23,37,42,.08);
  --shadow-lg:0 8px 40px rgba(23,37,42,.14);
  --shadow-sun:0 6px 18px rgba(242,169,0,.32);
  --glass:rgba(255,255,255,.78);
  --hero-1:#0F4C5C;--hero-2:#1A7488;--hero-ink:#FFFFFF;
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --gutter:16px;--sidebar-w:252px;--tabbar-h:68px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1517;--surface:#162125;--surface-2:#1A272B;--surface-3:#22323A;
  --ink:#E8EEF0;--ink-soft:#B4C2C6;--ink-mute:#83959A;
  --teal:#86D3E0;--teal-2:#4DB8CC;--teal-3:#3AA5B9;
  --primary:#3FA9BD;--primary-2:#56BDD0;--on-primary:#04181D;
  --tint:#1B3036;--tint-line:#2A4750;
  --sun:#FFB81C;--sun-2:#FFCB52;--on-sun:#1D1500;--sun-tint:#352A0E;
  --ok:#74CF7A;--ok-bg:#17301B;--bad:#FF8F85;--bad-bg:#3A1B18;
  --line:#27383E;--line-soft:#1F2E33;
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);
  --shadow-md:0 2px 4px rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.35);
  --shadow-lg:0 8px 40px rgba(0,0,0,.5);
  --shadow-sun:0 6px 18px rgba(255,184,28,.22);
  --glass:rgba(22,33,37,.8);
  --hero-1:#11505F;--hero-2:#1B7286;--hero-ink:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1517;--surface:#162125;--surface-2:#1A272B;--surface-3:#22323A;
    --ink:#E8EEF0;--ink-soft:#B4C2C6;--ink-mute:#83959A;
    --teal:#86D3E0;--teal-2:#4DB8CC;--teal-3:#3AA5B9;
    --primary:#3FA9BD;--primary-2:#56BDD0;--on-primary:#04181D;
    --tint:#1B3036;--tint-line:#2A4750;
    --sun:#FFB81C;--sun-2:#FFCB52;--on-sun:#1D1500;--sun-tint:#352A0E;
    --ok:#74CF7A;--ok-bg:#17301B;--bad:#FF8F85;--bad-bg:#3A1B18;
    --line:#27383E;--line-soft:#1F2E33;
    --shadow-xs:0 1px 2px rgba(0,0,0,.3);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);
    --shadow-md:0 2px 4px rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.35);
    --shadow-lg:0 8px 40px rgba(0,0,0,.5);
    --shadow-sun:0 6px 18px rgba(255,184,28,.22);
    --glass:rgba(22,33,37,.8);
    --hero-1:#11505F;--hero-2:#1B7286;--hero-ink:#FFFFFF;
  }
}

/* ================= БАЗА ================= */
*,*::before,*::after{box-sizing:border-box;margin:0}
html{font-size:17px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (min-width:600px){html{font-size:18px}}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  min-height:100dvh;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabbar-h) + 12px + env(safe-area-inset-bottom,0px));
  transition:background-color .25s;
}
main{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) var(--gutter) 24px}
h1{font-size:1.7rem;color:var(--ink);margin:6px 0 4px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
h2{font-size:1.15rem;color:var(--ink);margin:26px 0 12px;font-weight:800;letter-spacing:-.01em}
h3{letter-spacing:-.01em}
a{color:var(--teal)}
.sub{color:var(--ink-mute);margin-bottom:18px;font-size:.95rem}
button{
  font:inherit;cursor:pointer;border:0;border-radius:var(--r-md);padding:12px 16px;
  min-height:50px;color:inherit;background:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--sun);outline-offset:2px}
.hide{display:none!important}
::selection{background:var(--sun-tint)}

/* ================= НАВИГАЦИЯ ================= */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  display:flex;justify-content:space-around;gap:2px;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--glass);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line);
}
#tabs .brand,#tabs .nav-sep,#tabs .side-only,#tabs .side-foot{display:none}
#tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;padding:4px 2px;
  color:var(--ink-mute);font-weight:700;font-size:.66rem;border-radius:var(--r-md);transition:color .15s;
}
#tabs button .ic{
  display:grid;place-items:center;width:52px;height:30px;border-radius:999px;font-size:1.15rem;line-height:1;
  transition:background .25s var(--ease),transform .2s var(--ease);
}
#tabs button.on{color:var(--teal)}
#tabs button.on .ic{background:var(--tint)}
#tabs button:active .ic{transform:scale(.9)}
#tabs .mob-hide{display:none}

/* Десктоп: боковая панель */
@media (min-width:900px){
  body{padding-bottom:0;padding-left:var(--sidebar-w)}
  main{max-width:960px;padding:32px 40px 56px}
  #tabs{
    top:0;right:auto;bottom:0;width:var(--sidebar-w);flex-direction:column;justify-content:flex-start;gap:4px;
    padding:22px 14px;border-top:0;border-right:1px solid var(--line);background:var(--surface);
    backdrop-filter:none;-webkit-backdrop-filter:none;overflow-y:auto;
  }
  #tabs .brand{display:flex;align-items:center;gap:12px;padding:0 10px 22px;text-decoration:none}
  #tabs .brand img{width:40px;height:40px;border-radius:12px;box-shadow:var(--shadow-sm)}
  #tabs .brand b{display:block;color:var(--ink);font-size:1rem;font-weight:800;letter-spacing:-.01em;line-height:1.1}
  #tabs .brand small{display:block;color:var(--ink-mute);font-size:.75rem;font-weight:600}
  #tabs .nav-sep{display:block;height:1px;background:var(--line);margin:10px 8px}
  #tabs .side-only{display:flex}
  #tabs .mob-hide{display:flex}
  #tabs .mob-only{display:none}
  #tabs button{
    flex:0 0 auto;flex-direction:row;gap:12px;min-height:46px;padding:8px 12px;font-size:.9rem;font-weight:700;
    color:var(--ink-soft);text-align:left;
  }
  #tabs button .ic{width:auto;height:auto;background:none!important;font-size:1.15rem}
  #tabs button:hover{background:var(--surface-3);color:var(--ink)}
  #tabs button.on{background:var(--tint);color:var(--teal)}
  #tabs .side-foot{display:block;margin-top:auto;padding:14px 10px 0;color:var(--ink-mute);font-size:.75rem;line-height:1.5}
  .top{margin:-32px -40px 20px!important;padding:16px 40px!important}
}

/* ================= ПЕРЕХОДЫ ================= */
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#app.enter>*{animation:enter .38s var(--ease) both}
#app.enter>*:nth-child(2){animation-delay:.03s}
#app.enter>*:nth-child(3){animation-delay:.06s}
#app.enter>*:nth-child(4){animation-delay:.09s}
#app.enter>*:nth-child(n+5){animation-delay:.12s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ================= ШАПКА ЭКРАНА ================= */
.top{
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;
  margin:calc(-12px - env(safe-area-inset-top,0px)) calc(-1 * var(--gutter)) 16px;
  padding:calc(10px + env(safe-area-inset-top,0px)) var(--gutter) 10px;
  background:var(--glass);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line-soft);
}
.back{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  color:var(--ink);font-weight:700;font-size:.9rem;min-height:42px;padding:8px 14px;border-radius:999px;
  box-shadow:var(--shadow-xs);transition:transform .1s,border-color .15s;
}
.back:hover{border-color:var(--teal-3)}
.back:active{transform:scale(.96)}
.count{margin-left:auto;color:var(--ink-mute);font-size:.85rem;font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}

/* ================= ГЛАВНАЯ ================= */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 20px;margin:4px 0 18px;
  background:linear-gradient(135deg,var(--hero-1) 0%,var(--hero-2) 100%);color:var(--hero-ink);
  box-shadow:var(--shadow-md);
}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,197,61,.45),transparent 70%)}
.hero .hi{font-size:.85rem;font-weight:700;opacity:.85;letter-spacing:.02em}
.hero h1{color:inherit;font-size:1.65rem;margin:4px 0 14px}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:.82rem;font-weight:700;background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.hero .cta{margin-top:16px;max-width:100%;text-align:left;display:inline-flex;align-items:center;gap:8px;background:var(--sun);color:var(--on-sun);font-weight:800;min-height:46px;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow-sun);position:relative;z-index:1;transition:transform .1s}
.hero .cta:active{transform:scale(.97)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 12px}
.section-head h2{margin:0}
.link-btn{min-height:40px;padding:8px 12px;color:var(--teal);font-weight:700;font-size:.88rem;border-radius:999px}
.link-btn:hover{background:var(--tint)}

/* ================= КАРТОЧКИ ТЕМ ================= */
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.themes{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.theme{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 14px 14px;min-height:132px;
  box-shadow:var(--shadow-xs);transition:transform .18s var(--ease),box-shadow .2s,border-color .2s;
}
.theme:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--tint-line)}
.theme:active{transform:scale(.98)}
.theme .e{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--surface-3);font-size:1.7rem;line-height:1}
.theme .n{font-weight:800;color:var(--ink);font-size:.95rem;line-height:1.25}
.theme .meta{display:block;margin-top:auto;width:100%;color:var(--ink-mute);font-size:.75rem;font-weight:600}
.theme .meta .bar{display:block;height:5px;margin:6px 0 0}
.theme .meta .bar i{width:0}
.theme .star{position:absolute;top:12px;right:12px;font-size:.95rem}
.theme .imported-tag,.lesson-block .imported-tag{
  position:absolute;top:12px;right:12px;background:var(--tint);color:var(--teal);border:1px solid var(--tint-line);
  font-size:.62rem;padding:2px 8px;border-radius:999px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
}
.theme .star+.imported-tag,.theme .imported-tag+.star{right:auto}

/* Кнопка «Добавить» */
.add-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 14px;
  background:transparent;border:1.5px dashed var(--line);color:var(--teal);font-weight:700;font-size:.92rem;
  min-height:50px;padding:10px 16px;border-radius:var(--r-md);transition:border-color .15s,background .15s;
}
.add-btn:hover{border-color:var(--teal-3);background:var(--tint)}
.add-btn:active{transform:scale(.99)}

/* ================= ПРОГРЕСС ================= */
.bar{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--sun-2));border-radius:999px;transition:width .45s var(--ease)}

/* ================= ФЛЕШ-КАРТОЧКА ================= */
.card{
  max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
  padding:28px 18px 20px;text-align:center;box-shadow:var(--shadow-md);
}
.card .big{font-size:clamp(4rem,22vw,5.6rem);line-height:1.1;animation:pop .45s var(--ease)}
.card .ru{font-size:1.1rem;color:var(--ink-mute);margin-top:10px;font-weight:600}
.card .sr{font-size:clamp(1.9rem,9vw,2.6rem);font-weight:800;color:var(--teal);margin-top:4px;word-break:break-word;letter-spacing:-.02em}
.card.compact{padding:20px 16px}
.card.compact .big{font-size:clamp(3.2rem,16vw,4.2rem)}
.card.compact .sr{margin-top:0}
.card.compact .back{margin-top:12px!important}
.say{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:18px;
  background:var(--sun);color:var(--on-sun);font-weight:800;font-size:1rem;border-radius:999px;
  box-shadow:var(--shadow-sun);transition:transform .1s,filter .15s;
}
.say:hover{filter:brightness(1.04)}
.say:active{transform:scale(.98)}
.say.alt{background:var(--tint);color:var(--teal);box-shadow:none;margin-top:10px}

/* ================= КНОПКИ ДЕЙСТВИЙ ================= */
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.card+.nav,.res+.nav{max-width:560px;margin-left:auto;margin-right:auto}
.nav button{
  background:var(--primary);color:var(--on-primary);font-weight:700;font-size:.98rem;min-height:52px;
  border-radius:var(--r-md);box-shadow:var(--shadow-sm);transition:transform .1s,filter .15s,box-shadow .15s;
}
.nav button:hover{filter:brightness(1.08)}
.nav button:active{transform:scale(.98);box-shadow:none}
.nav button.light{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-xs)}
.nav button.light:hover{filter:none;border-color:var(--teal-3)}
.nav button:disabled{opacity:.38;cursor:default;box-shadow:none;filter:none}
.wide{grid-column:1/-1}
kbd{font-family:inherit;font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-mute)}
.kbd-hint{display:none;text-align:center;color:var(--ink-mute);font-size:.78rem;margin-top:14px}
@media (hover:hover) and (min-width:900px){.kbd-hint{display:block}}

/* ================= ТЕСТЫ ================= */
.q{font-size:1.02rem;text-align:center;margin:16px 0 8px;color:var(--ink-soft);font-weight:600}
.opts{display:grid;gap:10px;margin-top:10px;max-width:560px;margin-left:auto;margin-right:auto}
.opt{
  background:var(--surface);border:1.5px solid var(--line);font-size:1.2rem;font-weight:700;color:var(--ink);
  min-height:58px;padding:10px 14px;border-radius:var(--r-md);box-shadow:var(--shadow-xs);
  transition:transform .1s,border-color .15s,background .2s;
}
.opt:hover{border-color:var(--teal-3)}
.opt:active{transform:scale(.99)}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);animation:pop .35s var(--ease)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .4s}
.opts.emo{grid-template-columns:repeat(3,1fr)}
.opts.emo .opt{font-size:2.6rem;min-height:100px;padding:6px}
.msg{text-align:center;font-size:1rem;font-weight:700;min-height:1.6em;margin-top:12px}
.res{text-align:center;padding:24px 0 8px;animation:fadeIn .3s}
.res .score{font-size:3.2rem;font-weight:800;color:var(--teal);letter-spacing:-.03em}

/* ================= СТАТИСТИКА ================= */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 0 12px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 14px;box-shadow:var(--shadow-xs)}
.stat b{display:block;font-size:1.6rem;color:var(--ink);font-weight:800;letter-spacing:-.02em}
.stat small{color:var(--ink-mute);font-size:.8rem;font-weight:600}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow-xs)}
.days i{aspect-ratio:1;border-radius:6px;background:var(--surface-3)}
.days i.on{background:linear-gradient(135deg,var(--sun),var(--sun-2))}
.days i.today{outline:2px solid var(--teal-3);outline-offset:1px}
.days-cap{display:flex;justify-content:space-between;color:var(--ink-mute);font-size:.75rem;margin-top:6px;font-weight:600}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow-xs)}
.row .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;align-items:baseline}
.row .bar{margin:10px 0 4px;height:6px}
.row small{color:var(--ink-mute);font-size:.8rem}
.grid-2{display:grid;gap:0 16px}
@media (min-width:900px){.grid-2{grid-template-columns:1fr 1fr}}

/* ================= НАСТРОЙКИ ================= */
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-xs)}
.set label{display:block;font-weight:800;color:var(--ink);margin-bottom:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface-3);border-radius:var(--r-md)}
.seg button{background:transparent;color:var(--ink-soft);font-weight:700;padding:8px 4px;font-size:.88rem;min-height:42px;border-radius:11px;transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--teal);box-shadow:var(--shadow-sm)}
.seg button small{display:block;font-size:.7rem;font-weight:600;opacity:.75;margin-top:1px}
.note{color:var(--ink-mute);font-size:.85rem;margin-top:10px;line-height:1.5}

/* ================= МЕНЮ «ЕЩЁ» ================= */
.menu{display:grid;gap:10px}
@media (min-width:600px){.menu{grid-template-columns:1fr 1fr}}
.menu-item{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;text-decoration:none;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;min-height:72px;
  box-shadow:var(--shadow-xs);transition:transform .15s var(--ease),border-color .15s,box-shadow .2s;
}
.menu-item:hover{border-color:var(--tint-line);box-shadow:var(--shadow-sm)}
.menu-item:active{transform:scale(.99)}
.menu-item .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--surface-3);font-size:1.3rem;flex-shrink:0}
.menu-item b{display:block;font-weight:800;font-size:.98rem}
.menu-item small{display:block;color:var(--ink-mute);font-size:.8rem;margin-top:2px}
.menu-item .go{margin-left:auto;color:var(--ink-mute);font-size:1.1rem}

/* ================= ДИАЛОГИ ================= */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.bub{max-width:88%;padding:11px 46px 11px 15px;border-radius:20px;position:relative;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-xs);animation:enter .3s var(--ease)}
.bub.them{align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--tint);border-color:var(--tint-line);border-bottom-right-radius:6px}
.bub .bs{font-weight:800;color:var(--teal);font-size:1.05rem;line-height:1.3}
.bub .br{color:var(--ink-mute);font-size:.82rem;margin-top:3px}
.spk{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:36px;width:36px;padding:0;border-radius:50%;font-size:1rem;transition:background .15s}
.spk:hover{background:var(--surface-3)}
.hintru{text-align:center;color:var(--ink-soft);margin:10px 0 6px;font-size:.92rem}
.slot{min-height:70px;border:2px dashed var(--line);border-radius:var(--r-lg);padding:10px;display:flex;flex-wrap:wrap;gap:8px;background:var(--surface-2);margin:10px 0;align-items:center;transition:border-color .2s}
.slot:has(.tile){border-color:var(--tint-line)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.tile{min-height:46px;padding:8px 14px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);font-weight:800;font-size:1.02rem;border-radius:12px;box-shadow:0 2px 0 var(--line);transition:transform .1s,border-color .15s}
.tile:hover{border-color:var(--teal-3)}
.tile:active{transform:translateY(2px);box-shadow:none}
.slot .tile{background:var(--primary);color:var(--on-primary);border-color:var(--primary);box-shadow:none;animation:pop .25s var(--ease)}

/* ================= АЗБУКА ================= */
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.lt{background:var(--surface);border:1.5px solid var(--line);color:var(--ink);font-weight:800;font-size:1.25rem;min-height:54px;padding:6px 2px;border-radius:var(--r-sm);transition:transform .1s,border-color .15s,background .15s}
.lt:hover{border-color:var(--teal-3)}
.lt:active{transform:scale(.94)}
.lt.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary);box-shadow:var(--shadow-sm)}
@media (min-width:900px){.alpha-wrap{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}.alpha-wrap .card{position:sticky;top:24px;margin-top:0!important}}

/* ================= УРОКИ ================= */
.lesson-block{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:12px;
  position:relative;cursor:pointer;-webkit-user-select:none;user-select:none;box-shadow:var(--shadow-xs);
  transition:transform .18s var(--ease),box-shadow .2s,border-color .2s;
}
.lesson-block:hover{box-shadow:var(--shadow-md);border-color:var(--tint-line);transform:translateY(-1px)}
.lesson-block:active{transform:scale(.99)}
.lesson-block h3{color:var(--ink);font-size:1.05rem;margin-bottom:6px;line-height:1.3;padding-right:70px;font-weight:800}
.lesson-block p{color:var(--ink-soft);font-size:.9rem;margin-bottom:10px;line-height:1.45}
.lesson-block small{color:var(--ink-mute);font-size:.8rem;font-weight:700}
.lesson-block .bar{height:6px;margin:8px 0 0}
.lesson-block .num{display:inline-grid;place-items:center;background:var(--sun-tint);color:var(--on-sun);font-weight:800;width:28px;height:28px;border-radius:9px;margin-right:10px;font-size:.85rem;vertical-align:-2px}
:root[data-theme="dark"] .lesson-block .num{color:var(--sun)}
.lesson-block .done-tag{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:800;font-size:.8rem;background:var(--ok-bg);padding:3px 10px;border-radius:999px}
.lesson-content{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;overflow-wrap:break-word;box-shadow:var(--shadow-xs);line-height:1.6}
.lesson-content h2{color:var(--teal);font-size:1.2rem;margin:0 0 12px}
.lesson-content p{margin-bottom:12px;color:var(--ink)}
.lesson-content .example{background:var(--tint);border-left:4px solid var(--teal-3);padding:12px 14px;border-radius:10px;margin:12px 0;font-size:.95rem;line-height:1.55}
.lesson-content table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.92rem;border-radius:12px;overflow:hidden}
.lesson-content td,.lesson-content th{border:1px solid var(--line);padding:9px 11px;text-align:left;word-break:break-word}
.lesson-content th{background:var(--surface-3);font-weight:800}
.lesson-content pre{background:var(--surface-2);border:1px solid var(--line-soft);padding:12px;border-radius:10px;overflow-x:auto;font-size:.78rem;line-height:1.4;font-family:ui-monospace,"SF Mono",Consolas,monospace}
.quiz-box{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-top:12px}
.quiz-box .q{text-align:left;margin-top:0;color:var(--ink)}
.quiz-box .opt{min-height:50px;font-size:1rem}

/* ================= ИМПОРТ ================= */
.example-box{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:12px;margin:12px 0}
.example-box pre{background:transparent;padding:0;margin:0 0 10px;max-height:180px;overflow:auto;font-size:.72rem;line-height:1.45;font-family:ui-monospace,"SF Mono",Consolas,monospace;white-space:pre-wrap;word-break:break-all;color:var(--ink-soft)}
.example-box textarea{background:var(--surface)!important;color:var(--ink)!important}
.copy-example{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--teal);font-weight:700;min-height:42px;font-size:.88rem}
.copy-example:hover{border-color:var(--teal-3)}
.file-label{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1.5px dashed var(--line);color:var(--teal);font-weight:700;padding:14px 16px;border-radius:var(--r-md);cursor:pointer;margin:10px 0;min-height:54px;transition:border-color .15s,background .15s}
.file-label:hover{border-color:var(--teal-3);background:var(--tint)}
.file-label input{position:absolute;opacity:0;width:1px;height:1px}
.manual-paste-box{margin:12px 0;padding:14px;background:var(--tint);border:1.5px dashed var(--tint-line);border-radius:var(--r-md);animation:fadeIn .2s}
.manual-paste-box .hint{color:var(--teal);font-weight:700;font-size:.9rem;text-align:center;margin-bottom:10px;line-height:1.4}
.manual-paste-box .hint b{background:var(--primary);color:var(--on-primary);padding:2px 8px;border-radius:6px}
.manual-paste-box textarea{
  width:100%;min-height:140px;font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:16px;line-height:1.4;padding:12px;
  border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);
  resize:vertical;-webkit-user-select:text;user-select:text;-webkit-appearance:none;outline:none;
}
.manual-paste-box textarea:focus{border-color:var(--sun);box-shadow:0 0 0 3px rgba(242,169,0,.18)}
.manual-paste-box .parser-status{font-size:.85rem;color:var(--ink-soft);margin-top:8px;text-align:center;font-weight:600}
.manual-paste-box .parser-status.ok{color:var(--ok)}
.manual-paste-box .parser-status.bad{color:var(--bad)}

/* ================= ОБМЕН МАТЕРИАЛАМИ ================= */
.share-group{margin-bottom:14px}
.share-group h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.share-group h2 small{color:var(--ink-mute);font-size:.8rem;font-weight:600}
.share-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow-xs)}
.share-item label{flex:1;display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0}
.share-item input[type=checkbox]{width:22px;height:22px;accent-color:var(--primary);flex-shrink:0}
.share-item .si-name{display:block;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.share-item .si-meta{display:block;color:var(--ink-mute);font-size:.8rem;font-weight:500}
.share-item .si-del{border:1px solid var(--line);color:var(--bad);min-height:40px;min-width:40px;padding:0;border-radius:12px;flex-shrink:0}
.share-item .si-del:hover{background:var(--bad-bg);border-color:var(--bad)}
.share-empty{color:var(--ink-mute);font-size:.9rem;margin:0 0 10px;padding:14px;border:1px dashed var(--line);border-radius:var(--r-md);text-align:center}
.share-preview{list-style:none;padding:0;margin:10px 0;font-size:.92rem}
.share-preview li{padding:8px 0;border-bottom:1px solid var(--line-soft)}
.share-preview li.bad{color:var(--bad)}
.share-opt{display:flex;align-items:center;gap:8px;font-size:.92rem;margin:8px 0;cursor:pointer}
.share-opt input{width:20px;height:20px;accent-color:var(--primary)}

/* ================= ГЛАВНАЯ: ЦЕЛЬ, СЛОВО ДНЯ, ПОИСК ================= */
.home-top{display:grid;gap:14px;margin:4px 0 14px}
@media (min-width:900px){.home-top{grid-template-columns:1.7fr 1fr}}
.home-top .hero{margin:0;display:flex;gap:16px;align-items:center;justify-content:space-between}
.hero-main{flex:1;min-width:0;position:relative;z-index:1}
.goal{position:relative;z-index:1;flex-shrink:0;display:grid;justify-items:center;gap:4px}
.goal .ring-bg{stroke:rgba(255,255,255,.18)}
.goal .ring-fg{stroke:var(--sun-2);transition:stroke-dashoffset 1s var(--ease)}
.goal-txt{position:absolute;top:0;left:0;width:92px;height:92px;display:grid;place-content:center;text-align:center;line-height:1}
.goal-txt b{font-size:1.5rem;font-weight:800}
.goal-txt small{font-size:.7rem;opacity:.8;font-weight:700;margin-top:2px}
.goal-cap{font-size:.7rem;font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
@media (max-width:420px){.home-top .hero{flex-direction:column-reverse;align-items:flex-start}.goal{position:absolute;top:18px;right:16px}.goal .ring{width:70px;height:70px}.goal-txt{width:70px;height:70px}.goal-txt b{font-size:1.15rem}.goal-cap{display:none}.hero h1{padding-right:76px}}
.wod{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px 16px 10px;box-shadow:var(--shadow-xs);display:flex;flex-direction:column;justify-content:space-between;gap:8px;overflow:hidden}
.wod::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 160px at 100% 0%,var(--sun-tint),transparent 70%);pointer-events:none}
.wod>*{position:relative}
.wod-tag{align-self:flex-start;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-mute)}
.wod-body{display:flex;align-items:center;gap:14px}
.wod-e{font-size:2.6rem;line-height:1}
.wod-t{min-width:0;flex:1}
.wod-t b{display:block;font-size:1.35rem;font-weight:800;color:var(--teal);letter-spacing:-.01em;word-break:break-word}
.wod-t small{color:var(--ink-mute);font-weight:600}
.wod-say{width:48px;height:48px;min-height:48px;padding:0;border-radius:50%;background:var(--sun);box-shadow:var(--shadow-sun);font-size:1.15rem;flex-shrink:0;transition:transform .1s}
.wod-say:active{transform:scale(.92)}
.wod .link-btn{align-self:flex-start;margin-left:-12px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 8px 0 16px;min-height:52px;margin:0 0 14px;transition:border-color .15s,box-shadow .15s;cursor:text}
.search:focus-within{border-color:var(--teal-3);box-shadow:0 0 0 4px var(--tint);outline:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none;padding:12px 0}
.search input::placeholder{color:var(--ink-mute)}
.s-kbd{display:none}
@media (hover:hover) and (min-width:900px){.s-kbd{display:inline-block}}
.results{display:grid;gap:8px}
@media (min-width:700px){.results{grid-template-columns:1fr 1fr}}
.result{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:4px 6px 4px 4px;box-shadow:var(--shadow-xs);animation:enter .25s var(--ease)}
.r-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;min-height:56px;padding:6px 10px;border-radius:12px}
.r-main:hover{background:var(--surface-2)}
.r-e{font-size:1.7rem;line-height:1}
.r-t{min-width:0}
.r-t b{display:block;color:var(--teal);font-weight:800;word-break:break-word}
.r-t small{display:block;color:var(--ink-mute);font-size:.8rem}
.r-say{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;flex-shrink:0}
.r-say:hover{background:var(--surface-3)}
.review-banner{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:0 0 10px;padding:14px 16px;min-height:72px;
  background:var(--sun-tint);border:1px solid color-mix(in srgb,var(--sun) 35%,transparent);border-radius:var(--r-lg);color:var(--ink);
  transition:transform .15s var(--ease),box-shadow .2s;
}
.review-banner:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.review-banner:active{transform:scale(.99)}
.review-banner .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--surface);font-size:1.3rem;flex-shrink:0;box-shadow:var(--shadow-xs)}
.review-banner b{display:block;font-weight:800}
.review-banner small{display:block;color:var(--ink-soft);font-size:.82rem;margin-top:2px}
.review-banner .go{margin-left:auto;color:var(--ink-mute);font-size:1.2rem}
.review-banner.calm{background:var(--surface);border-color:var(--line)}
.review-banner.gold{background:linear-gradient(135deg,var(--hero-1),var(--hero-2));border:0;color:var(--hero-ink)}
.review-banner.gold small,.review-banner.gold .go{color:inherit;opacity:.85}
.review-banner.gold .ic{background:rgba(255,255,255,.18);box-shadow:none}
.muted{color:var(--ink-mute);font-size:.82rem;font-weight:600}

/* ================= КАРТОЧКА: МИКРОФОН, АЛФАВИТ, СВАЙП ================= */
.pill{min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--teal);font-weight:800;font-size:.8rem}
.pill:hover{border-color:var(--teal-3)}
.say.listening{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,.45)}70%{box-shadow:0 0 0 14px rgba(179,38,30,0)}100%{box-shadow:0 0 0 0 rgba(179,38,30,0)}}
.speech-out{min-height:0;font-size:.9rem;font-weight:600;color:var(--ink-soft);margin-top:10px;line-height:1.4}
.speech-out:empty{display:none}
.speech-out.ok{color:var(--ok)}
.speech-out.mid{color:var(--teal)}
.speech-out.bad{color:var(--bad)}
.swipe-hint{display:none;text-align:center;color:var(--ink-mute);font-size:.78rem;margin-top:12px}
@media (hover:none) and (pointer:coarse){.swipe-hint{display:block}}
.card{touch-action:pan-y}
.res-emoji{font-size:4.2rem;line-height:1.1;animation:pop .6s var(--ease)}
.shake{animation:shake .4s}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:300}

/* ================= СТАТИСТИКА: ДОП ================= */
.stat-ic{display:block;font-size:1.2rem;margin-bottom:6px}
.days i.l1{background:color-mix(in srgb,var(--sun) 35%,var(--surface-3))}
.days i.l2{background:color-mix(in srgb,var(--sun) 65%,var(--surface-3))}
.days i.l3{background:linear-gradient(135deg,var(--sun),var(--sun-2))}
.days-cap span{display:inline-flex;align-items:center;gap:3px}
.days-cap .lg{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--surface-3)}
@media (max-width:420px){.days-cap span:nth-child(2){display:none}}

/* ================= УСТАНОВКА ================= */
.install-box{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:0 0 12px;padding:14px 16px;min-height:72px;
  background:var(--tint);border:1px solid var(--tint-line);border-radius:var(--r-lg);color:var(--ink);
}
.install-box .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--surface);font-size:1.3rem;flex-shrink:0}
.install-box b{display:block;font-weight:800}
.install-box small{display:block;color:var(--ink-soft);font-size:.82rem;margin-top:2px;line-height:1.4}
.install-box .go{margin-left:auto;color:var(--ink-mute);font-size:1.2rem}

/* ================= ТОСТ ================= */
.toast{
  position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:.9rem;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);z-index:200;max-width:calc(100% - 32px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.toast{bottom:28px;left:calc(50% + var(--sidebar-w)/2)}}
</style>

<main id="app"></main>
<nav id="tabs" aria-label="Разделы">
  <a class="brand" href="#/home"><img src="icons/icon.svg" alt=""><span><b>Сербский</b><small>для жизни</small></span></a>
  <button data-p="home"><span class="ic">🏠</span><span>Слова</span></button>

  <button data-p="dialogs"><span class="ic">💬</span><span>Диалоги</span></button>
  <button data-p="tests"><span class="ic">📝</span><span>Тесты</span></button>
  <button data-p="alphabet" class="mob-hide"><span class="ic">🔤</span><span>Азбука</span></button>
  <button data-p="stats" class="mob-hide"><span class="ic">📊</span><span>Успехи</span></button>

  <div class="side-foot">Горячие клавиши: <kbd>←</kbd> <kbd>→</kbd> листать, <kbd>Пробел</kbd> озвучить, <kbd>1</kbd>–<kbd>4</kbd> ответ</div>
</nav>

<script>

const RATE = {slow:.6, normal:.9, fast:1.15};
let currentAudio = null;
async function speak(text, rate) {
  if (!text) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  // 1 — Netlify Function (свой домен, без CORS). Без сети уже слышанные слова отдаёт кэш Service Worker
  if (navigator.onLine || navigator.serviceWorker?.controller) {
    try {
      const audio = new Audio('/.netlify/functions/tts?text=' + encodeURIComponent(text));
      audio.playbackRate = rate || RATE[settings.speed];
      currentAudio = audio;
      await audio.play();
      return;
    } catch(e) {}
  }
  // 2 — браузерный SpeechSynthesis
  if (!('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'sr-RS'; u.rate = rate || RATE[settings.speed];
    const voices = speechSynthesis.getVoices();
    const v = voices.find(v => v.lang.startsWith('sr')) || voices.find(v => v.lang.startsWith('hr')) || voices.find(v => v.lang.startsWith('bs'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e) {}
}

/* ==== ЛАТИНИЦА ↔ КИРИЛЛИЦА ==== */
const L2C = {a:'а',b:'б',c:'ц','č':'ч','ć':'ћ',d:'д','đ':'ђ',e:'е',f:'ф',g:'г',h:'х',i:'и',j:'ј',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',r:'р',s:'с','š':'ш',t:'т',u:'у',v:'в',z:'з','ž':'ж'};
const L2C_DI = {lj:'љ',nj:'њ','dž':'џ'};
const C2L = {}; Object.entries({...L2C, ...L2C_DI}).forEach(([l,c]) => C2L[c] = l);
function toCyr(s){
  s = String(s).normalize('NFC'); let o = '';
  for (let i = 0; i < s.length; i++){
    const two = s.substr(i,2), di = L2C_DI[two.toLowerCase()];
    if (di) { o += two[0] === two[0].toLowerCase() ? di : di.toUpperCase(); i++; continue; }
    const ch = s[i], lo = ch.toLowerCase();
    let c = L2C[lo];
    // буква с ударением (ȁ, é…): переводим основу, знак ударения сохраняем
    if (!c) { const d = lo.normalize('NFD'); if (d.length > 1 && L2C[d[0]]) c = L2C[d[0]] + d.slice(1); }
    o += c ? (ch !== lo ? c[0].toUpperCase() + c.slice(1) : c) : ch;
  }
  return o;
}
const toLat = s => [...String(s).toLowerCase()].map(ch => C2L[ch] ?? ch).join('');
// Сербское слово в выбранном в настройках алфавите
const srText = s => settings.script === 'cyr' ? toCyr(s) : s;
// Для поиска и сравнения: без регистра, ударений и диакритики (č → c, đ → dj)
const fold = s => toLat(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'dj').replace(/[^\p{L}\p{N} ]+/gu,' ').replace(/\s+/g,' ').trim();
function similarity(a, b){
  if (a === b) return 1;
  if (!a.length || !b.length) return 0;
  let prev = Array.from({length:b.length+1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++){
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return 1 - prev[b.length] / Math.max(a.length, b.length);
}

/* ==== ЗВУКИ, ВИБРАЦИЯ, КОНФЕТТИ ==== */
let audioCtx = null;
function fx(kind){
  if (!settings.fx) return;
  try {
    if (navigator.vibrate) navigator.vibrate(kind === 'bad' ? [40,60,40] : 18);
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'ok' ? [660, 880] : kind === 'win' ? [523, 659, 784, 1047] : [233, 185];
    const t0 = audioCtx.currentTime + .01;
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + i * (kind === 'win' ? .11 : .09);
      o.type = kind === 'bad' ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.16, t + .015);
      g.gain.exponentialRampToValueAtTime(.0001, t + .24);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + .26);
    });
  } catch(e) {}
}
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const dpr = devicePixelRatio || 1, W = c.width = innerWidth*dpr, H = c.height = innerHeight*dpr, ctx = c.getContext('2d');
  const colors = ['#F2A900','#FFC53D','#0F4C5C','#2A8598','#E4572E','#76B041','#C6E3EA'];
  const parts = Array.from({length:150}, () => ({
    x:W/2 + (Math.random()-.5)*W*.25, y:H*.4, vx:(Math.random()-.5)*16*dpr, vy:(-Math.random()*15-7)*dpr,
    s:(Math.random()*7+5)*dpr, r:Math.random()*6.3, vr:(Math.random()-.5)*.35, c:colors[Math.random()*colors.length|0]
  }));
  const start = performance.now();
  (function frame(now){
    ctx.clearRect(0,0,W,H);
    const fade = Math.min(1, (2800 - (now - start)) / 600);
    parts.forEach(p => {
      p.vy += .38*dpr; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, fade); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore();
    });
    if (now - start < 2800) requestAnimationFrame(frame); else c.remove();
  })(start);
}
function celebrate(good){ fx(good ? 'win' : 'ok'); if (good) confetti(); }

/* ==== СВАЙПЫ ПО КАРТОЧКЕ (телефон) ==== */
function swipe(el, onNext, onPrev){
  let x0 = null, y0 = 0, horiz = false;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; horiz = false; el.style.transition = 'none'; }, {passive:true});
  el.addEventListener('touchmove', e => {
    if (x0 === null) return;
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if (!horiz && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) horiz = true;
    if (horiz) el.style.transform = `translateX(${dx*.7}px) rotate(${dx*.025}deg)`;
  }, {passive:true});
  const end = e => {
    if (x0 === null) return;
    const dx = (e.changedTouches ? e.changedTouches[0].clientX : x0) - x0; x0 = null;
    el.style.transition = 'transform .3s var(--ease)'; el.style.transform = '';
    if (horiz && Math.abs(dx) > 70) { const f = dx < 0 ? onNext : onPrev; if (f) f(); }
  };
  el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
}

/* ==== ПРОВЕРКА ПРОИЗНОШЕНИЯ (микрофон) ==== */
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
function listenWord(target, btn, out){
  if (!Recognition) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const rec = new Recognition();
  rec.lang = 'sr-RS'; rec.interimResults = false; rec.maxAlternatives = 5;
  const label = btn.innerHTML;
  const show = (html, kind) => { out.innerHTML = html; out.className = 'speech-out ' + (kind||''); };
  btn.classList.add('listening'); btn.innerHTML = '🎙️ Говорите…';
  show('Скажите: <b>' + esc(srText(target)) + '</b>');
  let done = false;
  rec.onresult = e => {
    done = true;
    const want = fold(target);
    const heard = [...e.results[0]].map(a => a.transcript).sort((a,b) => similarity(fold(b),want) - similarity(fold(a),want))[0] || '';
    const score = similarity(fold(heard), want);
    if (score >= .8) { show('🎉 Отлично! Слышно: «' + esc(heard) + '»', 'ok'); fx('ok'); }
    else if (score >= .5) show('👍 Почти! Слышно: «' + esc(heard) + '». Послушайте и попробуйте ещё', 'mid');
    else { show('Не похоже: «' + esc(heard) + '». Нажмите 🔊 и повторите', 'bad'); fx('bad'); }
  };
  rec.onerror = e => {
    done = true;
    const why = {'not-allowed':'Нет доступа к микрофону — разрешите его в настройках браузера', 'service-not-allowed':'Нет доступа к микрофону',
      'no-speech':'Ничего не слышно — попробуйте ещё раз', 'audio-capture':'Микрофон не найден', 'network':'Для распознавания нужен интернет'}[e.error];
    show(why || 'Распознавание речи недоступно в этом браузере', 'bad');
  };
  rec.onend = () => { btn.classList.remove('listening'); btn.innerHTML = label; if (!done) show('Ничего не слышно — попробуйте ещё раз', 'bad'); };
  try { rec.start(); } catch(e) { rec.onend(); }
}

}

  // Тема, которую стоит продолжить: первая начатая, но не досмотренная — иначе первая не начатая
  const progress = t => t.words.filter(w=>stats.words[w.sr]?.seen>0).length;
  const next = themes.find(t => { const p = progress(t); return p > 0 && p < t.words.length; }) || themes.find(t => progress(t) === 0) || themes[0];

        </div>
        <div class="goal" title="Цель дня: ${goal} карточек и ответов">

          <span class="goal-cap">${done >= goal ? '🎯 готово!' : 'цель дня'}</span>
        </div>
      </section>
      ${wod ? `
      <section class="wod">
        <span class="wod-tag">✨ Слово дня</span>
        <div class="wod-body">
          <span class="wod-e">${esc(wod.w.e||'📖')}</span>
          <div class="wod-t"><b>${esc(srText(wod.w.srStress||wod.w.sr))}</b><small>${esc(wod.w.ru)}</small></div>
          <button class="wod-say" id="wodSay" type="button" aria-label="Послушать">🔊</button>
        </div>
        <button class="link-btn" id="wodOpen" type="button">Тема «${esc(wod.t.name)}» →</button>
      </section>` : ''}
    </div>
    <label class="search">
      <span class="s-ic" aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="Найти слово — по-русски или по-сербски" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Поиск слова">
      <kbd class="s-kbd">/</kbd>
    </label>
    <div id="searchRes" class="hide"></div>
    <div id="homeMain">
      ${review.length ? `
      <button class="review-banner" id="review" type="button">
        <span class="ic">🔁</span>
        <span><b>Повторите сложные слова</b><small>${review.length} ${plural(review.length,'слово','слова','слов')} с ошибками — это займёт пару минут</small></span>
        <span class="go">›</span>
      </button>` : ''}
      <div class="section-head"><h2>Темы слов</h2><button class="link-btn" id="goLesson" type="button">📖 Уроки →</button></div>
      <div class="themes">
        ${themes.map(t=>{
          const p = progress(t);
          return `
          <button class="theme" data-id="${esc(t.id)}">
            ${importedIds.has(t.id)?'<span class="imported-tag">свой</span>':''}
            ${p && p === t.words.length ? '<span class="star" title="Все слова просмотрены">✅</span>' : ''}
            <span class="e">${esc(t.emoji||'📚')}</span>
            <span class="n">${esc(t.name)}</span>
            <span class="meta">${p ? p+' из '+t.words.length : t.words.length+' '+plural(t.words.length,'слово','слова','слов')}
              <span class="bar"><i style="width:${p/t.words.length*100}%"></i></span></span>
          </button>`;}).join('')}
      </div>
      <button class="add-btn" id="addWords" type="button" style="margin-top:14px">＋ Добавить свою тему слов</button>
    </div>`;
  $app.querySelectorAll('.theme').forEach(b=>b.onclick=()=>learn(b.dataset.id,0));
  const cont = document.getElementById('continue');
  if (cont) cont.onclick = () => { const p = progress(next); learn(next.id, p < next.words.length ? p : 0); };
  if (wod) {
    document.getElementById('wodSay').onclick = () => speak(wod.w.sr);
    document.getElementById('wodOpen').onclick = () => learn(wod.t.id, wod.i);
  }
  const rv = document.getElementById('review');
  if (rv) rv.onclick = () => quiz(REVIEW_ID);
  document.getElementById('goLesson').onclick = lessonPage;
  document.getElementById('addWords').onclick = () => importJsonDialog('words');

  // Поиск по всем словам
  const q = document.getElementById('q'), res = document.getElementById('searchRes'), main = document.getElementById('homeMain');
  const words = uniqueWords();
  q.oninput = () => {
    const s = fold(q.value);
    if (!s) { res.classList.add('hide'); main.classList.remove('hide'); return; }
    const found = words.filter(x => fold(x.w.ru).includes(s) || fold(x.w.sr).includes(s)).slice(0, 40);

      ? `<p class="sub" style="margin:4px 2px 10px">Найдено: ${found.length}</p><div class="results">${found.map((x,k) => `

            <button class="r-say" data-say="${k}" type="button" aria-label="Послушать">🔊</button>
          </div>`).join('')}</div>`
      : `<p class="share-empty">Ничего не найдено по запросу «${esc(q.value)}»</p>`;
    res.classList.remove('hide'); main.classList.add('hide');
    res.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const x = found[+b.dataset.k]; learn(x.t.id, x.i); });
    res.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(found[+b.dataset.say].w.sr));
  };
}

/* ==== КАРТОЧКИ ==== */
function learn(id,i){
  setTab('home');
  const t = getAllWords().find(x=>x.id===id);
  if (!t || !t.words[i]) return home();
  const w = t.words[i], last = i===t.words.length-1;
  wordRec(w.sr).seen++; touchDay(); saveStats();
  $app.innerHTML = `
    <div class="top"><button class="back" id="home">← Темы</button>
      <button class="pill" id="script" type="button" title="Латиница / кириллица">${settings.script==='cyr'?'Ћир':'Lat'}</button>
      <span class="count">${esc(t.emoji||'📚')} ${i+1} из ${t.words.length}</span></div>
    <div class="bar"><i style="width:${(i+1)/t.words.length*100}%"></i></div>
    <div class="card" id="card">
      <div class="big">${esc(w.e||'📖')}</div>
      <div class="ru">${esc(w.ru)}</div>
      <div class="sr" id="srWord">${esc(srText(w.srStress || w.sr))}</div>
      <button class="say" id="say">🔊 Послушать</button>
      ${Recognition ? '<button class="say alt" id="mic" type="button">🎤 Скажите сами</button><div class="speech-out" id="micOut"></div>' : ''}
    </div>
    <div class="nav">
      <button class="light" id="prev" ${i===0?'disabled':''}>← Назад</button>
      ${last?'<button id="test">Проверить себя</button>':'<button id="next">Дальше →</button>'}
    </div>
    <p class="kbd-hint"><kbd>←</kbd> <kbd>→</kbd> листать · <kbd>Пробел</kbd> послушать</p>
    <p class="swipe-hint">Листайте карточку пальцем ← →</p>`;
  document.getElementById('home').onclick = home;
  document.getElementById('say').onclick = () => speak(w.sr);
  document.getElementById('prev').onclick = () => learn(id,i-1);
  const goNext = last ? () => quiz(id) : () => learn(id,i+1);
  if (last) document.getElementById('test').onclick = goNext;
  else document.getElementById('next').onclick = goNext;
  swipe(document.getElementById('card'), goNext, i > 0 ? () => learn(id,i-1) : null);
  const mic = document.getElementById('mic');
  if (mic) mic.onclick = () => listenWord(w.sr, mic, document.getElementById('micOut'));
  document.getElementById('script').onclick = e => {
    settings.script = settings.script === 'cyr' ? 'lat' : 'cyr'; saveSettings();
    e.currentTarget.textContent = settings.script === 'cyr' ? 'Ћир' : 'Lat';
    document.getElementById('srWord').textContent = srText(w.srStress || w.sr);
  };
}

/* ==== ВИКТОРИНА ==== */
function quiz(id){
  setTab(id === REVIEW_ID ? 'tests' : 'home');
  const t = id === REVIEW_ID ? reviewTheme() : getAllWords().find(x=>x.id===id);
  if (!t) return home();
  if (!t.words.length) {
    $app.innerHTML = `
      <div class="top"><button class="back" id="home">← Тесты</button><span class="count">🔁 Повторение</span></div>
      <div class="res"><div class="res-emoji">🌟</div><div class="score" style="font-size:1.8rem">Ошибок нет</div>
      <p class="sub">Сложные слова появятся здесь, если ошибиться в тесте</p></div>
      <div class="nav"><button class="wide" id="themes">К темам</button></div>`;
    document.getElementById('home').onclick = testsPage;
    document.getElementById('themes').onclick = home;
    return;
  }
  // Неверные варианты берём из темы, а если в ней мало слов — из всех слов
  const pool = (t.pool && t.pool.length > t.words.length) ? t.pool : t.words;
  const order = shuffle(t.words.map((_,i)=>i));
  let n = 0, right = 0;
  const backTo = id === REVIEW_ID ? testsPage : home;
  const ask = () => {
    if (n >= order.length) return result();
    const w = t.words[order[n]];
    const emo = Math.random() < 0.5;
    let wrong;
    if (emo){
      const seen = new Set([w.e]); wrong = [];
      for (const x of shuffle(pool)){ if (!seen.has(x.e)){ seen.add(x.e); wrong.push(x); if (wrong.length===2) break; } }
    } else wrong = shuffle(pool.filter(x=>x.sr!==w.sr)).slice(0,2);
    const opts = shuffle([w,...wrong]);
    $app.innerHTML = `
      <div class="top"><button class="back" id="home">← ${id === REVIEW_ID ? 'Тесты' : 'Темы'}</button><span class="count">${esc(t.emoji||'📚')} ${n+1} из ${order.length}</span></div>
      <div class="bar"><i style="width:${n/order.length*100}%"></i></div>
      ${emo
        ? `<div class="card compact"><div class="sr">${esc(srText(w.srStress || w.sr))}</div><button class="back" id="hear0" style="margin-top:12px">🔊 Послушать</button></div><p class="q">Выберите картинку</p>`
        : `<div class="card compact"><div class="big">${esc(w.e||'📖')}</div><div class="ru">${esc(w.ru)}</div></div><p class="q">Как это по-сербски?</p>`}
      <div class="opts${emo?' emo':''}">${opts.map(o=>`<button class="opt" data-sr="${esc(o.sr)}">${esc(emo?o.e:srText(o.srStress||o.sr))}</button>`).join('')}</div>
      <div class="msg" id="msg"></div>
      <div class="nav hide" id="nx"><button class="light" id="hear">🔊 Послушать</button><button id="go">Дальше →</button></div>
      <p class="kbd-hint"><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> — выбрать ответ · <kbd>→</kbd> дальше</p>`;
    document.getElementById('home').onclick = backTo;
    const h0 = document.getElementById('hear0'); if (h0) h0.onclick = () => speak(w.sr);
    let answered = false;
    $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if (answered) return; answered = true;
      const ok = b.dataset.sr === w.sr, r = wordRec(w.sr), msg = document.getElementById('msg');
      if (ok){ right++; r.ok++; b.classList.add('right'); msg.textContent='✅ Верно!'; msg.style.color = 'var(--ok)'; fx('ok'); }
      else { r.bad++; b.classList.add('wrong'); $app.querySelectorAll('.opt').forEach(x=>{ if(x.dataset.sr===w.sr) x.classList.add('right'); });
        msg.textContent = emo ? 'Правильно: '+w.e+' '+w.ru : 'Правильно: '+srText(w.srStress||w.sr); msg.style.color = 'var(--bad)'; fx('bad'); }
      touchDay(); saveStats();
      document.getElementById('nx').classList.remove('hide');
      document.getElementById('hear').onclick = () => speak(w.sr);
      document.getElementById('go').onclick = () => { n++; ask(); };
    });
  };
  const result = () => {
    stats.tests.push({id,right,total:order.length,date:today()});
    if (stats.tests.length>300) stats.tests = stats.tests.slice(-300);
    saveStats();
    const good = right/order.length >= 0.8;
    $app.innerHTML = `
      <div class="res"><div class="res-emoji">${good?'🎉':'💪'}</div>
      <div class="score">${right} из ${order.length}</div>
      <p class="sub">${good?'Отлично!':'Хорошо! Попробуйте ещё раз.'}</p></div>
      <div class="nav"><button class="light" id="again">Ещё раз</button><button id="themes">${id === REVIEW_ID ? 'К тестам' : 'Другие темы'}</button></div>`;
    document.getElementById('again').onclick = () => quiz(id);
    document.getElementById('themes').onclick = backTo;
    celebrate(good);
  };
  ask();
}

/* ==== УРОКИ ==== */
function courseDone(lesson){
  const total = lesson.blocks.length; let done = 0;
  const st = stats.lesson || {};
  lesson.blocks.forEach((_, i) => { if (st[lesson.id + ':' + i]) done++; });
  return { done, total };
}
function lessonPage(){
  setTab('lesson');
  const lessons = getAllLessons();
  $app.innerHTML = `
    <h1>Уроки</h1>
    <p class="sub">Грамматика по шагам: короткая теория и мини-тест в каждом блоке</p>
    ${lessons.map(l => {
      const p = courseDone(l);
      return `<div class="lesson-block" data-lid="${esc(l.id)}" role="button" tabindex="0">
        <h3>${esc(l.emoji||'📖')} ${esc(l.title)}</h3>${l.imported?'<span class="imported-tag">свой</span>':''}
        <p>${esc(l.description||'')}</p>
        <small>${p.done === p.total ? '<span class="done-tag">✅ Курс пройден</span>' : 'Пройдено '+p.done+' из '+p.total+' '+plural(p.total,'блока','блоков','блоков')}</small>
        <div class="bar"><i style="width:${p.total ? p.done/p.total*100 : 0}%"></i></div>
      </div>`;
    }).join('')}
    <button class="add-btn" id="importBtn" type="button">＋ Добавить свой урок (JSON)</button>`;
  $app.querySelectorAll('[data-lid]').forEach(el => el.onclick = () => openLesson(el.dataset.lid));
  document.getElementById('importBtn').onclick = () => importJsonDialog('lesson');
}

function openLesson(lid){
  const lesson = getLesson(lid);
  if (!lesson) return lessonPage();
  setTab('lesson');
  const st = stats.lesson || {};
  const p = courseDone(lesson);
  $app.innerHTML = `
    <div class="top"><button class="back" id="back">← Уроки</button><span class="count">${p.done} из ${p.total} ${plural(p.total,'блока','блоков','блоков')}</span></div>
    <h1>${esc(lesson.emoji||'📖')} ${esc(lesson.title)}</h1>
    <p class="sub">${esc(lesson.description||'')}</p>
    <div class="bar" style="margin-bottom:18px"><i style="width:${p.total ? p.done/p.total*100 : 0}%"></i></div>
    ${lesson.blocks.map((b,i)=>`
      <div class="lesson-block" data-bid="${i}" role="button" tabindex="0">
        <h3><span class="num">${i+1}</span>${esc(b.title)}</h3>
        <p>${esc(b.description||'')}</p>
        ${st[lesson.id+':'+i]?'<span class="done-tag">✅ пройдено</span>':''}
      </div>`).join('')}
    <div class="nav" style="margin-top:16px">
      <button class="wide" id="finalBtn">🏆 Финальный тест</button>
    </div>
    ${lesson.imported?'':'<div class="nav"><button class="wide light" id="dlBtn">💾 Скачать JSON</button></div>'}`;
  document.getElementById('back').onclick = lessonPage;
  $app.querySelectorAll('[data-bid]').forEach(el=>el.onclick = () => openBlock(lid, +el.dataset.bid));
  document.getElementById('finalBtn').onclick = () => finalTest(lid);
  const dl = document.getElementById('dlBtn');
  if (dl) dl.onclick = () => downloadLesson(lid);
}

function openBlock(lid, idx){
  const lesson = getLesson(lid);
  const block = lesson && lesson.blocks[idx];
  if (!block) return lessonPage();
  let qIndex = 0, right = 0;
  const total = (block.quiz||[]).length;
  $app.innerHTML = `
    <div class="top"><button class="back" id="back">← Блоки</button><span class="count">Блок ${idx+1} из ${lesson.blocks.length}</span></div>
    <div class="lesson-content">${lesson.imported ? sanitizeHtml(block.content) : block.content}</div>
    ${total>0?'<div class="quiz-box" id="quizBox"></div>':''}
    <div class="nav">
      <button class="light" id="back2">← Назад</button>
      <button id="next" disabled>${idx+1<lesson.blocks.length?'Дальше →':'Готово'}</button>
    </div>`;
  document.getElementById('back').onclick = () => openLesson(lid);
  document.getElementById('back2').onclick = () => openLesson(lid);
  const nextBtn = document.getElementById('next');
  const box = document.getElementById('quizBox');
  if (!box) {
    stats.lesson = stats.lesson || {}; stats.lesson[lid+':'+idx] = true; saveStats();
    nextBtn.disabled = false;
    nextBtn.onclick = () => { if (idx+1 < lesson.blocks.length) openBlock(lid, idx+1); else openLesson(lid); };
    return;
  }
  const showQuiz = () => {
    if (qIndex >= total) {
      const passed = right === total;
      if (passed) { stats.lesson = stats.lesson || {}; stats.lesson[lid+':'+idx] = true; saveStats(); celebrate(true); }
      box.innerHTML = `
        <p style="color:${passed?'var(--ok)':'var(--bad)'};font-weight:700;font-size:1.05rem;text-align:center">
          ${passed ? '✅ Блок пройден! ' : '❌ Не всё верно. '}${right} из ${total}
        </p>
        ${passed ? '' : '<p class="note" style="text-align:center">Повторите блок, чтобы он засчитался.</p>'}
        ${passed ? '' : '<div class="nav" style="margin-top:10px"><button id="retryBlock">↻ Повторить блок</button></div>'}`;
      nextBtn.disabled = !passed;
      if (passed) nextBtn.onclick = () => { if (idx+1 < lesson.blocks.length) openBlock(lid, idx+1); else openLesson(lid); };
      const retry = box.querySelector('#retryBlock');
      if (retry) retry.onclick = () => openBlock(lid, idx);
      return;
    }
    const q = block.quiz[qIndex];
    box.innerHTML = `
      <p class="q"><strong>Вопрос ${qIndex+1}:</strong> ${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
      <div class="msg" id="qmsg"></div>`;
    let answered = false;
    box.querySelectorAll('.opt').forEach(b=>{
      b.onclick = () => {
        if (answered) return; answered = true;
        const i = +b.dataset.i;
        if (i === q.a) { right++; b.classList.add('right'); document.getElementById('qmsg').textContent='✅ Верно!'; fx('ok'); }
        else { b.classList.add('wrong'); box.querySelectorAll('.opt')[q.a].classList.add('right');
          document.getElementById('qmsg').textContent = '❌ Правильный ответ: ' + q.opts[q.a]; fx('bad'); }
        touchDay(); saveStats();
        qIndex++; setTimeout(showQuiz, 900);
      };
    });
  };
  showQuiz();
}

function finalTest(lid){
  setTab('lesson');
  const lesson = getLesson(lid);
  if (!lesson) return lessonPage();
  const allQ = [];
  lesson.blocks.forEach(b => (b.quiz||[]).forEach(q => allQ.push(q)));
  if (!allQ.length) { alert('В этом уроке нет вопросов для теста.'); return; }
  const order = shuffle(allQ);
  let n = 0, right = 0;
  const ask = () => {
    if (n >= order.length) return result();
    const q = order[n];
    $app.innerHTML = `
      <div class="top"><button class="back" id="back">← Урок</button><span class="count">Тест ${n+1} из ${order.length}</span></div>
      <div class="bar"><i style="width:${n/order.length*100}%"></i></div>
      <div class="quiz-box" style="margin-top:16px">
        <p class="q"><strong>${esc(q.q)}</strong></p>
        <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
        <div class="msg" id="msg"></div>
      </div>`;
    document.getElementById('back').onclick = () => openLesson(lid);
    let answered = false;
    $app.querySelectorAll('.opt').forEach(b=>{
      b.onclick = () => {
        if (answered) return; answered = true;
        const i = +b.dataset.i;
        if (i === q.a) { right++; b.classList.add('right'); document.getElementById('msg').textContent='✅ Верно!'; fx('ok'); }
        else { b.classList.add('wrong'); $app.querySelectorAll('.opt')[q.a].classList.add('right');
          document.getElementById('msg').textContent = '❌ Правильный ответ: ' + q.opts[q.a]; fx('bad'); }
        touchDay(); saveStats();
        setTimeout(() => { n++; ask(); }, 900);
      };
    });
  };
  const result = () => {
    const total = order.length;
    const pct = Math.round(right/total*100);
    stats.tests.push({id:'final-'+lid,right,total,date:today()});
    saveStats();
    $app.innerHTML = `
      <div class="res"><div class="res-emoji">${pct>=80?'🎉':'💪'}</div>
      <div class="score">${right} / ${total}</div><p class="sub">${pct}%</p>
      <p>${pct>=80?'Отлично! Материал усвоен.':pct>=60?'Хорошо, но стоит повторить некоторые блоки.':'Рекомендуется пройти урок заново.'}</p></div>
      <div class="nav"><button class="light" id="again">Пройти ещё раз</button><button id="lesson">К уроку</button></div>`;
    celebrate(pct >= 80);
    document.getElementById('again').onclick = () => finalTest(lid);
    document.getElementById('lesson').onclick = () => openLesson(lid);
  };
  ask();
}

function downloadLesson(lid){
  const lesson = getLesson(lid);
  const data = { ...lesson }; delete data.imported;
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (data.id||'lesson') + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ==== ВАЛИДАЦИЯ ==== */
function validateLesson(data){
  if (!data || typeof data !== 'object') return 'JSON должен быть объектом';
  if (!data.title) return 'Отсутствует поле "title"';
  if (!Array.isArray(data.blocks) || data.blocks.length === 0) return 'Поле "blocks" должно быть непустым массивом';
  for (let i=0; i<data.blocks.length; i++){
    const b = data.blocks[i];
    if (!b.title) return `Блок ${i+1}: отсутствует "title"`;
    if (!b.content) return `Блок ${i+1}: отсутствует "content"`;
    if (!Array.isArray(b.quiz)) return `Блок ${i+1}: поле "quiz" должно быть массивом`;
    for (let j=0; j<b.quiz.length; j++){
      const q = b.quiz[j];
      if (!q.q) return `Блок ${i+1}, вопрос ${j+1}: отсутствует "q"`;
      if (!Array.isArray(q.opts) || q.opts.length < 2) return `Блок ${i+1}, вопрос ${j+1}: "opts" ≥2 вариантов`;
      if (typeof q.a !== 'number' || q.a < 0 || q.a >= q.opts.length) return `Блок ${i+1}, вопрос ${j+1}: некорректный индекс "a"`;
    }
  }
  return null;
}
function validateWords(data){
  if (!data || typeof data !== 'object') return 'JSON должен быть объектом';
  if (!data.name) return 'Отсутствует поле "name"';
  if (!Array.isArray(data.words) || data.words.length === 0) return 'Поле "words" должно быть непустым массивом';
  for (let i=0;i<data.words.length;i++){
    const w = data.words[i];
    if (!w.ru) return `Слово ${i+1}: нужно поле "ru"`;
    if (!w.sr) return `Слово ${i+1}: нужно поле "sr"`;
  }
  return null;
}
function validateDialogs(data){
  if (!data || typeof data !== 'object') return 'JSON должен быть объектом';
  if (!data.name) return 'Отсутствует поле "name"';
  if (!Array.isArray(data.lines) || data.lines.length === 0) return 'Поле "lines" должно быть непустым массивом';
  for (let i=0;i<data.lines.length;i++){
    const l = data.lines[i];
    if (!l.sr && !l.you) return `Строка ${i+1}: нужен "sr" или "you"`;
    if (!l.ru) return `Строка ${i+1}: отсутствует "ru"`;
  }
  if (!data.lines.some(l=>l.you)) return 'Диалог должен содержать хотя бы одну реплику "you"';
  return null;
}

const SHARE_TYPES = [
  { key:'words',   storeKey:'sr_words_v1',   label:'Темы слов', emoji:'📚', validate:validateWords,
    name:x=>x.name,  meta:x=>x.words.length+' '+plural(x.words.length,'слово','слова','слов'), builtinIds:()=>BUILTIN_WORDS.map(x=>x.id) },
  { key:'dialogs', storeKey:'sr_dialogs_v1', label:'Диалоги',   emoji:'💬', validate:validateDialogs,

  { key:'lessons', storeKey:'sr_lessons_v1', label:'Уроки',     emoji:'📖', validate:validateLesson,
    name:x=>x.title, meta:x=>x.blocks.length+' '+plural(x.blocks.length,'блок','блока','блоков'), builtinIds:()=>[BUILTIN_LESSON.id] }
];
const BUNDLE_FORMAT = 'words-rs-bundle';

const stripImported = x => { const c = { ...x }; delete c.imported; return c; };

function buildBundle(selected){
  const b = { format:BUNDLE_FORMAT, version:1, exportedAt:new Date().toISOString() };
  SHARE_TYPES.forEach(t => {
    b[t.key] = store.load(t.storeKey, []).filter(x => selected.has(t.key+':'+x.id)).map(stripImported);
  });
  return b;
}

// Принимает пакет (bundle) или одиночную тему/диалог/урок. Возвращает {words,dialogs,lessons} или строку-ошибку.
function parseShared(data){
  if (!data || typeof data !== 'object' || Array.isArray(data)) return 'JSON должен быть объектом';
  if (data.format === BUNDLE_FORMAT || (!data.name && !data.title && SHARE_TYPES.some(t => Array.isArray(data[t.key])))) {
    const out = {};
    SHARE_TYPES.forEach(t => { out[t.key] = Array.isArray(data[t.key]) ? data[t.key] : []; });
    return out;
  }
  if (Array.isArray(data.blocks)) return { words:[], dialogs:[], lessons:[data] };
  if (Array.isArray(data.lines))  return { words:[], dialogs:[data], lessons:[] };
  if (Array.isArray(data.words))  return { words:[data], dialogs:[], lessons:[] };
  return 'Не похоже на материалы приложения: нет "words", "lines" или "blocks"';
}

function downloadJson(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    if (!rows.length) { say(impMsg, 'В файле нет материалов', 'bad'); return; }

    const hasDup = okRows.some(r => r.dup);
    preview.innerHTML = `
      <ul class="share-preview">${rows.map(r => `
        <li class="${r.err?'bad':''}">${r.t.emoji} ${esc(r.label)}${r.err ? ' — ❌ ' + esc(r.err) : r.dup ? ' — <small>уже есть</small>' : ''}</li>`).join('')}
      </ul>
      ${hasDup ? '<label class="share-opt"><input type="checkbox" id="impReplace" checked> Заменить то, что уже есть (иначе — пропустить)</label>' : ''}
      <div class="nav"><button class="wide" id="impGo" type="button" ${okRows.length?'':'disabled'}>📥 Загрузить ${okRows.length} ${plural(okRows.length,'элемент','элемента','элементов')}</button></div>`;
    say(impMsg, okRows.length < rows.length ? 'Элементы с ошибками будут пропущены' : '');
    document.getElementById('impGo').onclick = () => {
      const replace = !!(document.getElementById('impReplace') || {}).checked;
      let added = 0, replaced = 0, skipped = 0;
      for (const t of SHARE_TYPES) {
        const arr = store.load(t.storeKey, []);
        const builtin = new Set(t.builtinIds());
        okRows.filter(r => r.t === t).forEach(r => {
          const item = stripImported(r.x);
          item.imported = true;
          if (!item.id || builtin.has(item.id)) item.id = t.key + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
          const at = arr.findIndex(x => x.id === item.id);
          if (at < 0) { arr.push(item); added++; }
          else if (replace) { arr[at] = item; replaced++; }
          else skipped++;
        });
        if (!store.save(t.storeKey, arr)) { say(impMsg, 'Не удалось сохранить (память браузера переполнена)', 'bad'); return; }
      }
      sharePage();
      say(document.getElementById('impMsg'),
        '✅ Добавлено: ' + added + (replaced ? ', заменено: ' + replaced : '') + (skipped ? ', пропущено: ' + skipped : ''), 'ok');
    };
  };
  let timer = null;
  ta.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => handle(ta.value), 400); });
  document.getElementById('impFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => { ta.value = ''; handle(String(reader.result)); };
    reader.onerror = () => say(impMsg, 'Ошибка чтения файла', 'bad');
    reader.readAsText(f);
  };
}

function dialog(id){
  setTab('dialogs');
  const d = getAllDialogs().find(x=>x.id===id);
  if (!d) return dialogsPage();
  const L = d.lines;
  stats.dlg = stats.dlg || {};
  const rec = stats.dlg[id] || (stats.dlg[id] = {done:0,errors:0});
  let i = 0, runErr = 0;
  $app.innerHTML = `
    <div class="top"><button class="back" id="home">← Диалоги</button><span class="count">${esc(d.emoji||'💬')} ${esc(d.name)}</span></div>
    <div class="bar"><i id="pb" style="width:0"></i></div>
    <div class="chat" id="chat"></div><div id="act"></div>`;
  document.getElementById('home').onclick = dialogsPage;
  const chat = document.getElementById('chat'), act = document.getElementById('act'), pb = document.getElementById('pb');
  const toEnd = () => setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),60);
  const bubble = (who, sr, ru, stress) => {
    const b = document.createElement('div');
    b.className = 'bub ' + who;
    b.innerHTML = `<div class="bs">${esc(srText(stress || sr))}</div><div class="br">${esc(ru||'')}</div><button class="spk" aria-label="Послушать">🔊</button>`;
    b.querySelector('.spk').onclick = () => speak(sr);
    chat.appendChild(b);
  };
  const normW = s => String(s||'').toLowerCase().replace(/[.,!?;:"„“”'’…()\-–—]/g,' ').split(/\s+/).filter(Boolean);
  const step = () => {
    while (i<L.length && !L[i].you){ bubble('them', L[i].sr, L[i].ru, L[i].srStress); i++; }
    pb.style.width = (i/L.length*100)+'%';
    if (i>=L.length) return finish();
    turn(L[i]); toEnd();
  };
  const turn = l => {
    const variants = [l.you,...(l.alt||[])];
    const main = normW(l.you), items = main.slice(), have = new Set(main);
    [...variants.slice(1).flatMap(normW), ...(l.extra||[]).flatMap(normW)].forEach(w=>{ if(!have.has(w)){ have.add(w); items.push(w); } });
    if (!(l.extra && l.extra.length)){
      shuffle([...new Set(L.flatMap(x=>normW(x.you||x.sr)))].filter(w=>!have.has(w))).slice(0,4).forEach(w=>items.push(w));
    }
    const pool = shuffle(items.map(w=>({w}))), sel = [];
    let te = 0;
    act.innerHTML = `
      <p class="hintru">Скажите: <b>${esc(l.ru||'')}</b></p>
      <div class="slot" id="slot"></div>
      <div class="tiles" id="tiles"></div>
      <div class="msg" id="m"></div>
      <div class="nav">
        <button class="light" id="reset">Сбросить</button>
        <button id="check">Проверить</button>
        <button class="light wide hide" id="show">Показать ответ</button>
      </div>`;
    const slot = document.getElementById('slot'), tiles = document.getElementById('tiles'), m = document.getElementById('m');
    const draw = () => {
      slot.innerHTML = sel.length ? sel.map(k=>`<button class="tile" data-k="${k}">${esc(srText(pool[k].w))}</button>`).join('') : '<span class="note" style="margin:0">Нажимайте на слова ниже</span>';
      tiles.innerHTML = pool.map((p,k)=>sel.includes(k)?'':`<button class="tile" data-k="${k}">${esc(srText(p.w))}</button>`).join('');
      slot.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ sel.splice(sel.indexOf(+b.dataset.k),1); draw(); });
      tiles.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ sel.push(+b.dataset.k); m.textContent=''; draw(); });
    };
    draw();
    const accept = text => {
      bubble('me', text, l.ru, l.youStress); speak(text); i++;
      act.innerHTML = `<div class="nav"><button class="light" id="hear">🔊 Послушать</button><button id="go">${i>=L.length?'Завершить':'Дальше →'}</button></div>`;
      document.getElementById('hear').onclick = () => speak(text);
      document.getElementById('go').onclick = step;
      toEnd();
    };
    document.getElementById('reset').onclick = () => { sel.length = 0; m.textContent = ''; draw(); };
    document.getElementById('check').onclick = () => {
      m.style.color = 'var(--bad)';
      if (!sel.length){ m.textContent = 'Составьте фразу из слов'; return; }
      const got = sel.map(k=>pool[k].w);
      const hit = variants.find(v=>{ const t = normW(v); return t.length===got.length && t.every((x,j)=>x===got[j]); });
      if (hit) { fx('ok'); return accept(hit); }
      te++; runErr++; rec.errors++; saveStats(); fx('bad');
      slot.classList.remove('shake'); void slot.offsetWidth; slot.classList.add('shake');
      m.textContent = 'Не совсем. Попробуйте ещё';
      if (te>=2) document.getElementById('show').classList.remove('hide');
    };
    document.getElementById('show').onclick = () => accept(l.you);
  };
  const finish = () => {
    rec.done++; touchDay(); saveStats();
    act.innerHTML = `
      <div class="res"><div class="res-emoji">${runErr?'💪':'🎉'}</div>
      <div class="score" style="font-size:2rem">Диалог пройден</div>
      <p class="sub">${runErr?'Ошибок: '+runErr:'Без ошибок!'}</p></div>
      <div class="nav"><button class="light" id="again">Ещё раз</button><button id="others">Другие диалоги</button></div>`;
    document.getElementById('again').onclick = () => dialog(id);
    document.getElementById('others').onclick = dialogsPage;
    celebrate(!runErr);
    toEnd();
  };
  step();
}

function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function streak(){
  let n = 0; const d = new Date();
  if (!stats.days[fmt(d)]) d.setDate(d.getDate()-1);
  while (stats.days[fmt(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function statsPage(){
  setTab('stats');
  const words = getAllWords();

  const ok = Object.values(stats.words).reduce((a,r)=>a+r.ok,0);
  const bad = Object.values(stats.words).reduce((a,r)=>a+r.bad,0);
  const pct = ok+bad ? Math.round(ok/(ok+bad)*100)+'%' : '—';
  const dlgStats = stats.dlg || {};
  const dlgDone = dialogs.filter(d => (dlgStats[d.id]?.done||0) > 0).length;

  // Календарь активности за 4 недели: чем ярче клетка, тем больше занимались
  const cal = [];
  for (let k = 27; k >= 0; k--) { const d = new Date(); d.setDate(d.getDate()-k); cal.push(fmt(d)); }
  const lvl = n => !n ? '' : n >= settings.goal ? ' l3' : n >= settings.goal/2 ? ' l2' : ' l1';
  const activeDays = cal.filter(d => stats.days[d]).length;
  $app.innerHTML = `

        <button data-s="slow">Медленно</button>
        <button data-s="normal">Обычно</button>
        <button data-s="fast">Быстро</button>
      </div>
    </div>
    <div class="set">
      <button class="say" id="try">🔊 Проверить звук</button>
      <p class="note">Для лучшего качества используется онлайн-сервис (при наличии интернета), иначе — локальный синтез речи.</p>
    </div>
    <div class="set">
      <label>Мои материалы</label>
      <button class="add-btn" id="shareBtn" type="button" style="margin:0">📦 Импорт / экспорт своих слов, диалогов и уроков</button>
      <p class="note">Сохраните свои материалы в файл, чтобы поделиться с другими или перенести на другое устройство.</p>
    </div>`;
  document.getElementById('shareBtn').onclick = sharePage;
  bindInstall();
  // Переключатели-сегменты: подсветка выбранного и сохранение
  const seg = (elId, get, set) => {
    const el = document.getElementById(elId);
    const mark = () => el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.s === String(get())));
    el.querySelectorAll('button').forEach(b => b.onclick = () => { set(b.dataset.s); saveSettings(); mark(); });
    mark();
  };
  seg('theme', () => settings.theme, v => { settings.theme = v; applyTheme(); });
  seg('script', () => settings.script, v => { settings.script = v; });
  seg('goal', () => settings.goal, v => { settings.goal = +v; });
  seg('fx', () => settings.fx ? 1 : 0, v => { settings.fx = v === '1'; if (settings.fx) fx('ok'); });
  const segS = document.getElementById('size');
  const markS = () => segS.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.s === settings.textSize));
  segS.querySelectorAll('button').forEach(b=>b.onclick = () => {
    settings.textSize = b.dataset.s; saveSettings(); applyTextSize(); markS();
  });
  markS();
  const segV = document.getElementById('speed');
  const markV = () => segV.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.s === settings.speed));
  segV.querySelectorAll('button').forEach(b=>b.onclick = () => {
    settings.speed = b.dataset.s; saveSettings(); markV();
  });
  markV();
  document.getElementById('try').onclick = () => speak('dobar dan');
}

/* ==== ЗАПУСК ==== */
applyTheme();
applyTextSize();
if ('speechSynthesis' in window) speechSynthesis.getVoices();
installRoutes();
runRoute();
// Офлайн-режим и установка на телефон
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
