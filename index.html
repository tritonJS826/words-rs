<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сербский для жизни</title>
<style>
:root{--paper:#FFF8EC;--ink:#1d2a2e;--teal:#0F4C5C;--sun:#F2A900;--ok:#2E7D32;--bad:#B3261E;--line:#e3d6bb}
*{box-sizing:border-box;margin:0}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100dvh;line-height:1.35;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 16px}
h1{font-size:1.5rem;color:var(--teal);margin:4px 0 2px}
.sub{color:#5b6b6f;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:12px 16px;min-height:54px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme{background:#fff;border:2px solid var(--line);text-align:center;padding:14px 6px;position:relative}
.theme .e{font-size:2.3rem;display:block}
.theme .n{font-weight:700;color:var(--teal);display:block;margin-top:4px}
.theme .star{position:absolute;top:8px;right:10px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px;position:sticky;top:0;background:var(--paper);padding:6px 0;z-index:5}
.back{background:#fff;border:2px solid var(--line);color:var(--teal);font-weight:700;min-height:46px;padding:8px 14px}
.count{margin-left:auto;color:#5b6b6f}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--sun);transition:width .25s}
.card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:16px 12px;text-align:center}
.card .big{font-size:clamp(3.5rem,20vw,5rem);line-height:1.1}
.card .ru{font-size:1.25rem;color:#5b6b6f;margin-top:4px}
.card .sr{font-size:clamp(1.8rem,9vw,2.4rem);font-weight:800;color:var(--teal);margin-top:4px;word-break:break-word}
.card.compact{padding:12px}
.card.compact .big{font-size:clamp(3rem,16vw,4rem)}
.card.compact .sr{margin-top:0}
.say{background:var(--sun);color:#1d2a2e;font-weight:800;font-size:1.1rem;width:100%;margin-top:12px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.nav button{background:var(--teal);color:#fff;font-weight:700;font-size:1rem;min-height:52px}
.nav button.light{background:#fff;color:var(--teal);border:2px solid var(--line)}
.nav button:disabled{opacity:.35;cursor:default}
.wide{grid-column:1/-1}
.q{font-size:1.05rem;text-align:center;margin:8px 0 6px;color:#5b6b6f}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{background:#fff;border:2px solid var(--line);font-size:1.3rem;font-weight:700;color:var(--teal);min-height:54px;padding:10px 12px}
.opt.right{background:#e6f4e7;border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:#fbe9e7;border-color:var(--bad);color:var(--bad)}
.msg{text-align:center;font-size:1.1rem;font-weight:700;min-height:1.6em;margin-top:8px}
.res{text-align:center;padding:10px 0}
.res .score{font-size:3.4rem;font-weight:800;color:var(--teal)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs button{background:transparent;color:#5b6b6f;font-weight:700;font-size:.72rem;padding:4px;min-height:48px;border-radius:14px}
#tabs button span{display:block;font-size:1.3rem;line-height:1.2}
#tabs button.on{background:#e8f1f3;color:var(--teal)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#fff;border:2px solid var(--line);border-radius:20px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.6rem;color:var(--teal)}
.stat small{color:#5b6b6f;font-size:.8rem}
h2{font-size:1.2rem;color:var(--teal);margin:18px 0 10px}
.row{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px}
.row .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.row .bar{margin:8px 0 4px;height:12px}
.row small{color:#5b6b6f}
.set{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.set label{display:block;font-weight:700;color:var(--teal);margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{background:#fff;border:2px solid var(--line);color:var(--teal);font-weight:700;padding:10px 4px;font-size:.9rem;min-height:48px}
.seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.note{color:#5b6b6f;font-size:.85rem;margin-top:8px}
.flash{font-weight:700;min-height:1.4em;margin-top:10px;color:var(--ok)}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bub{max-width:90%;padding:10px 14px;border-radius:18px;position:relative;background:#fff;border:2px solid var(--line)}
.bub.them{align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:#e8f1f3;border-color:#b9d3d9;border-bottom-right-radius:6px}
.bub .bs{font-weight:800;color:var(--teal);font-size:1.1rem;padding-right:34px}
.bub .br{color:#5b6b6f;font-size:.82rem;margin-top:2px;padding-right:34px}
.spk{position:absolute;right:4px;top:4px;min-height:36px;width:36px;padding:0;background:transparent;border-radius:50%;font-size:1rem}
.hintru{text-align:center;color:#5b6b6f;margin:4px 0}
.slot{min-height:64px;border:2px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;background:#fff;margin:8px 0;align-items:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-height:48px;padding:8px 14px;background:#fff;border:2px solid var(--line);color:var(--teal);font-weight:800;font-size:1.1rem;border-radius:14px}
.slot .tile{background:var(--teal);color:#fff;border-color:var(--teal)}
.opts.emo{grid-template-columns:repeat(3,1fr)}
.opts.emo .opt{font-size:2.6rem;min-height:92px;padding:6px}
@media (min-width:600px){ html{font-size:20px} }
</style>
</head>

</nav>

let DATA = null, DLG = null;
const $app = document.getElementById('app');
const $tabs = document.getElementById('tabs');

/* ---------- память ---------- */
const store = {
  load(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
};
let settings = Object.assign({speed:'normal',textSize:'normal'}, store.load('sr_settings',{}));
let stats = Object.assign({words:{},tests:[],days:{},dlg:{}}, store.load('sr_stats',{}));
const saveSettings = () => store.save('sr_settings',settings);
const saveStats = () => store.save('sr_stats',stats);
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const touchDay = () => { stats.days[today()] = 1; };
const wordRec = sr => stats.words[sr] || (stats.words[sr] = {seen:0,ok:0,bad:0});

/* ---------- размер текста ---------- */
const SIZES = {small:'15px', normal:'18px', large:'22px'};
function applyTextSize(){
  document.documentElement.style.fontSize = SIZES[settings.textSize] || '18px';
}

/* ---------- озвучка ---------- */
const LAT = {lj:'љ',nj:'њ','dž':'џ',a:'а',b:'б',c:'ц','č':'ч','ć':'ћ',d:'д','đ':'ђ',e:'е',f:'ф',g:'г',h:'х',i:'и',j:'ј',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',r:'р',s:'с','š':'ш',t:'т',u:'у',v:'в',z:'з','ž':'ж'};
function toCyr(s){
  s = s.toLowerCase().normalize('NFC'); let o = '';
  for (let i=0;i<s.length;i++){
    const two = s.substr(i,2);
    if (LAT[two]){ o += LAT[two]; i++; } else o += LAT[s[i]] || s[i];
  }
  return o;
}
const RATE = {slow:.6, normal:.85, fast:1.1};
const srVoices = () => {
  try { return ('speechSynthesis' in window ? speechSynthesis.getVoices() : []).filter(v=>/^(sr|hr|bs|sh)/i.test(v.lang)); }
  catch(e){ return []; }
};
function say(text){
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  try {
    const v = srVoices();
    if (v.length){
      const u = new SpeechSynthesisUtterance(text);
      u.voice = v[0]; u.lang = v[0].lang;
      u.rate = RATE[settings.speed];
      speechSynthesis.speak(u);
      return;
    }
  } catch(e){}
  const url = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=sr&q='+encodeURIComponent(toCyr(text));
  try {
    const a = new Audio(url);
    a.play().catch(()=>{
      if ('speechSynthesis' in window) try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'sr-RS'; u.rate = RATE[settings.speed];
        speechSynthesis.speak(u);
      } catch(e){}
    });
  } catch(e){
    if ('speechSynthesis' in window) try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'sr-RS'; u.rate = RATE[settings.speed];
      speechSynthesis.speak(u);
    } catch(e){}
  }
}

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const plural = (n,a,b,c) => { const m=n%100, k=n%10; return (m>10&&m<20)?c:(k===1?a:(k>=2&&k<=4?b:c)); };
let page = 'home';
function setTab(p){ page=p; $tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); window.scrollTo(0,0); }
$tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.p));
function go(p){ ({home,dialogs:dialogsPage,stats:statsPage,settings:settingsPage})[p](); }
const bestOf = id => Math.max(0,...stats.tests.filter(t=>t.id===id).map(t=>t.right/t.total));

/* ---------- данные ---------- */
function applyBase(d){
  if (!d || !Array.isArray(d.themes) || !d.themes.length) throw new Error('bad words');
  DATA = d;
}
function applyDlg(d){
  if (!d || !Array.isArray(d.dialogs) || !d.dialogs.length) throw new Error('bad dialogs');
  d.dialogs.forEach(x=>{ if (!x.id || !x.name || !Array.isArray(x.lines) || !x.lines.some(l=>l.you)) throw new Error('bad'); });
  DLG = d;
}

/* ---------- темы ---------- */
function home(){

    $app.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 2px"><h1 style="margin:0">Сербский для жизни</h1><a href="feedback.html" style="text-decoration:none;font-size:.85rem;color:var(--teal);white-space:nowrap">✉️ Связь</a></div><p class="sub">Данные не загружены. Запустите merge.py, чтобы вставить слова и диалоги.</p>';

      <a href="feedback.html" style="text-decoration:none;font-size:.85rem;color:var(--teal);white-space:nowrap">✉️ Связь</a>
    </div>

/* ---------- карточки ---------- */
function learn(id,i){
  setTab('home');
  const t = DATA.themes.find(x=>x.id===id), w = t.words[i], last = i===t.words.length-1;
  wordRec(w.sr).seen++; touchDay(); saveStats();
  $app.innerHTML = `
    <div class="top"><button class="back" id="home">← Темы</button><span class="count">${i+1} из ${t.words.length}</span></div>
    <div class="bar"><i style="width:${(i+1)/t.words.length*100}%"></i></div>
    <div class="card">
      <div class="big">${esc(w.e)}</div>
      <div class="ru">${esc(w.ru)}</div>
      <div class="sr">${esc(w.sr)}</div>
      <button class="say" id="say">🔊 Послушать</button>
    </div>
    <div class="nav">
      <button class="light" id="prev" ${i===0?'disabled':''}>← Назад</button>
      ${last?'<button id="test">Проверить себя</button>':'<button id="next">Дальше →</button>'}
    </div>`;
  document.getElementById('home').onclick = home;
  document.getElementById('say').onclick = () => say(w.sr);
  document.getElementById('prev').onclick = () => learn(id,i-1);
  if (last) document.getElementById('test').onclick = () => quiz(id);
  else document.getElementById('next').onclick = () => learn(id,i+1);
}

/* ---------- проверка ---------- */
function quiz(id){
  setTab('home');
  const t = DATA.themes.find(x=>x.id===id);
  const order = shuffle(t.words.map((_,i)=>i));
  let n = 0, right = 0;
  const ask = () => {
    if (n >= order.length) return result();
    const w = t.words[order[n]];
    const emo = Math.random() < 0.5;
    let wrong;
    if (emo){
      const seen = new Set([w.e]); wrong = [];
      for (const x of shuffle(t.words)){ if (!seen.has(x.e)){ seen.add(x.e); wrong.push(x); if (wrong.length===2) break; } }
    } else wrong = shuffle(t.words.filter(x=>x.sr!==w.sr)).slice(0,2);
    const opts = shuffle([w,...wrong]);
    $app.innerHTML = `
      <div class="top"><button class="back" id="home">← Темы</button><span class="count">${n+1} из ${order.length}</span></div>
      <div class="bar"><i style="width:${n/order.length*100}%"></i></div>
      ${emo
        ? `<div class="card compact"><div class="sr">${esc(w.sr)}</div><button class="back" id="hear0" style="margin-top:10px">🔊</button></div>
           <p class="q">Выберите картинку</p>`
        : `<div class="card compact"><div class="big">${esc(w.e)}</div><div class="ru">${esc(w.ru)}</div></div>
           <p class="q">Как это по-сербски?</p>`}
      <div class="opts${emo?' emo':''}">${opts.map(o=>`<button class="opt" data-sr="${esc(o.sr)}">${esc(emo?o.e:o.sr)}</button>`).join('')}</div>
      <div class="msg" id="msg"></div>
      <div class="nav hide" id="nx"><button class="light" id="hear">🔊 Послушать</button><button id="go">Дальше →</button></div>`;
    document.getElementById('home').onclick = home;
    const h0 = document.getElementById('hear0'); if (h0) h0.onclick = () => say(w.sr);
    let answered = false;
    $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if (answered) return; answered = true;
      const ok = b.dataset.sr === w.sr, r = wordRec(w.sr);
      if (ok){ right++; r.ok++; b.classList.add('right'); document.getElementById('msg').textContent='✅ Верно!'; }
      else {
        r.bad++; b.classList.add('wrong');
        $app.querySelectorAll('.opt').forEach(x=>{ if(x.dataset.sr===w.sr) x.classList.add('right'); });
        document.getElementById('msg').textContent = emo ? 'Правильно: '+w.e+' '+w.ru : 'Правильно: '+w.sr;
      }
      touchDay(); saveStats();
      document.getElementById('nx').classList.remove('hide');
      document.getElementById('hear').onclick = () => say(w.sr);
      document.getElementById('go').onclick = () => { n++; ask(); };
    });
  };
  const result = () => {
    stats.tests.push({id,right,total:order.length,date:today()});
    if (stats.tests.length>300) stats.tests = stats.tests.slice(-300);
    saveStats();
    const good = right/order.length >= 0.8;
    $app.innerHTML = `
      <div class="res">
        <div style="font-size:4rem">${good?'🎉':'💪'}</div>
        <div class="score">${right} из ${order.length}</div>
        <p class="sub">${good?'Отлично!':'Хорошо! Попробуйте ещё раз.'}</p>
      </div>
      <div class="nav">
        <button class="light" id="again">Ещё раз</button>
        <button id="themes">Другие темы</button>
      </div>`;
    document.getElementById('again').onclick = () => quiz(id);
    document.getElementById('themes').onclick = home;
  };
  ask();
}

/* ---------- успехи ---------- */
function streak(){
  let n = 0; const d = new Date();
  if (!stats.days[fmt(d)]) d.setDate(d.getDate()-1);
  while (stats.days[fmt(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function statsPage(){
  setTab('stats');
  if (!DATA){ $app.innerHTML = '<h1>Мои успехи</h1><p class="sub">Данные не загружены.</p>'; return; }
  const all = DATA.themes.flatMap(t=>t.words);
  const total = new Set(all.map(w=>w.sr)).size;
  const seen = new Set(all.filter(w=>stats.words[w.sr]?.seen>0).map(w=>w.sr)).size;
  const ok = Object.values(stats.words).reduce((a,r)=>a+r.ok,0);
  const bad = Object.values(stats.words).reduce((a,r)=>a+r.bad,0);
  const pct = ok+bad ? Math.round(ok/(ok+bad)*100)+'%' : '—';
  const hard = all.filter((w,i,a)=>a.findIndex(x=>x.sr===w.sr)===i && stats.words[w.sr]?.bad>0)
    .sort((a,b)=>(stats.words[b.sr].bad-stats.words[b.sr].ok)-(stats.words[a.sr].bad-stats.words[a.sr].ok)).slice(0,6);
  $app.innerHTML = `
    <h1>Мои успехи</h1>
    <div class="stats">
      <div class="stat"><b>${seen} / ${total}</b><small>слов просмотрено</small></div>
      <div class="stat"><b>${pct}</b><small>верных ответов</small></div>
      <div class="stat"><b>${stats.tests.length}</b><small>${plural(stats.tests.length,'проверка пройдена','проверки пройдено','проверок пройдено')}</small></div>
      <div class="stat"><b>${streak()}</b><small>${plural(streak(),'день подряд','дня подряд','дней подряд')}</small></div>
    </div>
    <h2>По темам</h2>
    ${DATA.themes.map(t=>{
      const s = t.words.filter(w=>stats.words[w.sr]?.seen>0).length, b = bestOf(t.id), has = stats.tests.some(x=>x.id===t.id);
      return `<div class="row"><div class="t"><span>${esc(t.emoji)} ${esc(t.name)}</span><span>${has?'лучший: '+Math.round(b*100)+'%':''}</span></div>
        <div class="bar"><i style="width:${s/t.words.length*100}%"></i></div><small>просмотрено ${s} из ${t.words.length}</small></div>`;}).join('')}
    ${DLG?`<h2>Диалоги</h2>${DLG.dialogs.map(d=>{const r=(stats.dlg||{})[d.id]||{done:0};return `<div class="row"><div class="t"><span>${esc(d.emoji||'💬')} ${esc(d.name)}</span><span>пройдено: ${r.done}</span></div></div>`;}).join('')}`:''}
    ${hard.length?`<h2>Чаще всего ошибки</h2>${hard.map(w=>`<div class="row"><div class="t"><span>${esc(w.e)} ${esc(w.sr)}</span><span>${esc(w.ru)}</span></div></div>`).join('')}`:''}`;
}

/* ---------- настройки ---------- */
function settingsPage(){
  setTab('settings');
  $app.innerHTML = `
    <h1>Настройки</h1>
    <div class="set">
      <label>Размер текста</label>
      <div class="seg" id="size">
        <button data-s="small">Мелкий</button>
        <button data-s="normal">Обычный</button>
        <button data-s="large">Крупный</button>
      </div>
    </div>
    <div class="set">
      <label>Скорость речи</label>
      <div class="seg" id="speed">
        <button data-s="slow">Медленно</button>
        <button data-s="normal">Обычно</button>
        <button data-s="fast">Быстро</button>
      </div>
    </div>
    <div class="set">
      <button class="say" id="try">🔊 Проверить звук</button>
      <p class="note">Если звук не слышен — проверьте громкость и разрешение на воспроизведение.</p>
    </div>`;
  const segS = document.getElementById('size');
  const markS = () => segS.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.s === settings.textSize));
  segS.querySelectorAll('button').forEach(b=>b.onclick = () => {
    settings.textSize = b.dataset.s; saveSettings(); applyTextSize(); markS();
  });
  markS();
  const segV = document.getElementById('speed');
  const markV = () => segV.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.s === settings.speed));
  segV.querySelectorAll('button').forEach(b=>b.onclick = () => {
    settings.speed = b.dataset.s; saveSettings(); markV();
  });
  markV();
  document.getElementById('try').onclick = () => say('dobar dan');
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { if (page==='settings' && DATA) settingsPage(); };

/* ---------- диалоги ---------- */
function dialogsPage(){
  setTab('dialogs');
  if (!DLG){
    $app.innerHTML = '<h1>Диалоги</h1><p class="sub">Данные не загружены. Запустите merge.py.</p>';
    return;
  }
  const dr = id => (stats.dlg||{})[id];
  $app.innerHTML = `
    <h1>Диалоги</h1>
    <p class="sub">Ответьте собеседнику, составив фразу из слов</p>
    <div class="themes">
      ${DLG.dialogs.map(d=>`
        <button class="theme" data-id="${esc(d.id)}">
          ${dr(d.id)&&dr(d.id).done?'<span class="star">⭐</span>':''}
          <span class="e">${esc(d.emoji||'💬')}</span><span class="n">${esc(d.name)}</span>
        </button>`).join('')}
    </div>`;
  $app.querySelectorAll('.theme').forEach(b=>b.onclick=()=>dialog(b.dataset.id));
}

function dialog(id){
  setTab('dialogs');
  const d = DLG.dialogs.find(x=>x.id===id), L = d.lines;
  stats.dlg = stats.dlg || {};
  const rec = stats.dlg[id] || (stats.dlg[id] = {done:0,errors:0});
  let i = 0, runErr = 0;
  $app.innerHTML = `
    <div class="top"><button class="back" id="home">← Диалоги</button><span class="count">${esc(d.emoji||'💬')} ${esc(d.name)}</span></div>
    <div class="bar"><i id="pb" style="width:0"></i></div>
    <div class="chat" id="chat"></div>
    <div id="act"></div>`;
  document.getElementById('home').onclick = dialogsPage;
  const chat = document.getElementById('chat'), act = document.getElementById('act'), pb = document.getElementById('pb');
  const toEnd = () => setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),60);

  const bubble = (who,sr,ru) => {
    const b = document.createElement('div');
    b.className = 'bub '+who;
    b.innerHTML = `<div class="bs">${esc(sr)}</div><div class="br">${esc(ru||'')}</div><button class="spk" aria-label="Послушать">🔊</button>`;
    b.querySelector('.spk').onclick = () => say(sr);
    chat.appendChild(b);
  };

  const step = () => {
    while (i<L.length && !L[i].you){ bubble('them',L[i].sr,L[i].ru); i++; }
    pb.style.width = (i/L.length*100)+'%';
    if (i>=L.length) return finish();
    turn(L[i]); toEnd();
  };

  const turn = l => {
    const variants = [l.you,...(l.alt||[])];
    const main = normW(l.you), items = main.slice(), have = new Set(main);
    [...variants.slice(1).flatMap(normW), ...(l.extra||[]).flatMap(normW)].forEach(w=>{ if(!have.has(w)){ have.add(w); items.push(w); } });
    if (!(l.extra && l.extra.length)){
      shuffle([...new Set(L.flatMap(x=>normW(x.you||x.sr)))].filter(w=>!have.has(w))).slice(0,4).forEach(w=>items.push(w));
    }
    const pool = shuffle(items.map(w=>({w}))), sel = [];
    let te = 0;
    act.innerHTML = `
      <p class="hintru">Скажите: <b>${esc(l.ru||'')}</b></p>
      <div class="slot" id="slot"></div>
      <div class="tiles" id="tiles"></div>
      <div class="msg" id="m"></div>
      <div class="nav">
        <button class="light" id="reset">Сбросить</button>
        <button id="check">Проверить</button>
        <button class="light wide hide" id="show">Показать ответ</button>
      </div>`;
    const slot = document.getElementById('slot'), tiles = document.getElementById('tiles'), m = document.getElementById('m');
    const draw = () => {
      slot.innerHTML = sel.length ? sel.map(k=>`<button class="tile" data-k="${k}">${esc(pool[k].w)}</button>`).join('') : '<span class="note">Нажимайте на слова ниже</span>';
      tiles.innerHTML = pool.map((p,k)=>sel.includes(k)?'':`<button class="tile" data-k="${k}">${esc(p.w)}</button>`).join('');
      slot.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ sel.splice(sel.indexOf(+b.dataset.k),1); draw(); });
      tiles.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ sel.push(+b.dataset.k); m.textContent=''; draw(); });
    };
    draw();
    const accept = text => {
      bubble('me',text,l.ru); say(text); i++;
      act.innerHTML = `<div class="nav"><button class="light" id="hear">🔊 Послушать</button><button id="go">${i>=L.length?'Завершить':'Дальше →'}</button></div>`;
      document.getElementById('hear').onclick = () => say(text);
      document.getElementById('go').onclick = step;
      toEnd();
    };
    document.getElementById('reset').onclick = () => { sel.length = 0; m.textContent = ''; draw(); };
    document.getElementById('check').onclick = () => {
      m.style.color = 'var(--bad)';
      if (!sel.length){ m.textContent = 'Составьте фразу из слов'; return; }
      const got = sel.map(k=>pool[k].w);
      const hit = variants.find(v=>{ const t = normW(v); return t.length===got.length && t.every((x,j)=>x===got[j]); });
      if (hit) return accept(hit);
      te++; runErr++; rec.errors++; saveStats();
      m.textContent = 'Не совсем. Попробуйте ещё';
      if (te>=2) document.getElementById('show').classList.remove('hide');
    };
    document.getElementById('show').onclick = () => accept(l.you);
  };

  const finish = () => {
    rec.done++; touchDay(); saveStats();
    act.innerHTML = `
      <div class="res">
        <div style="font-size:3.4rem">${runErr?'💪':'🎉'}</div>
        <div class="score" style="font-size:2rem">Диалог пройден</div>
        <p class="sub">${runErr?'Ошибок: '+runErr:'Без ошибок!'}</p>
      </div>
      <div class="nav"><button class="light" id="again">Ещё раз</button><button id="others">Другие диалоги</button></div>`;
    document.getElementById('again').onclick = () => dialog(id);
    document.getElementById('others').onclick = dialogsPage;
    toEnd();
  };
  step();
}

const normW = s => String(s||'').toLowerCase().replace(/[.,!?;:"„“”'’…()\-–—]/g,' ').split(/\s+/).filter(Boolean);

/* ---------- запуск ---------- */
applyTextSize();
if (typeof wordsData !== 'undefined' && wordsData){
  try { applyBase({themes: wordsData}); } catch(e){ console.error(e); }
}
if (typeof dialogsData !== 'undefined' && dialogsData){
  try { applyDlg({dialogs: dialogsData}); } catch(e){ console.error(e); }
}
home();
</script>
